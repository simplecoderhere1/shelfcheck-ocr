<title>ShelfCheck</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f4f2; color: #1a1a1a; padding-bottom: 100px;
  }
  header {
    padding: 14px 16px; background: #1a1a1a; color: #fff;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .section-toggle { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid #555; }
  .section-toggle button {
    padding: 7px 14px; border: none; background: #2a2a2a; color: #ccc; font-size: 13px; cursor: pointer;
  }
  .section-toggle button.active { background: #4a90d9; color: #fff; }

  main { padding: 12px; max-width: 700px; margin: 0 auto; }

  .summary {
    display: flex; gap: 10px; padding: 10px 14px; background: #fff; border-radius: 10px;
    margin-bottom: 12px; font-size: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); flex-wrap: wrap;
  }
  .summary b { font-size: 16px; }
  .summary .batch-time { margin-left: auto; color: #888; font-size: 12px; align-self: center; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .dot.red { background: #e0453c; }
  .dot.yellow { background: #e8b923; }
  .dot.green { background: #4caf50; }

  .segment {
    background: #fff; border-radius: 12px; margin-bottom: 14px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
  }
  .segment .imgwrap { position: relative; width: 100%; line-height: 0; }
  .segment img { width: 100%; display: block; }
  .segment .box {
    position: absolute; box-sizing: border-box; border-radius: 3px;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .segment .box.red { background: rgba(224,69,60,.28); border: 3px solid #e0453c; }
  .segment .box.yellow { background: rgba(232,185,35,.24); border: 3px solid #e8b923; }
  .segment .box { align-items: flex-start; }
  .segment .box span {
    position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
    min-width: 20px; height: 20px; line-height: 20px; border-radius: 10px; text-align: center;
    font-size: 12px; font-weight: 700; color: #fff; padding: 0 4px;
  }
  .segment .box.red span { background: #e0453c; }
  .segment .box.yellow span { background: #c99a00; }
  .flagged-list .num {
    min-width: 24px; height: 24px; line-height: 24px; border-radius: 12px; text-align: center;
    font-size: 13px; font-weight: 700; color: #fff; flex: none;
  }
  .flagged-list .num.red { background: #e0453c; }
  .flagged-list .num.yellow { background: #c99a00; }
  .segment .meta { padding: 8px 12px; font-size: 12px; color: #888; display: flex; justify-content: space-between; }
  .segment .status { padding: 30px; text-align: center; color: #888; font-size: 14px; }

  .flagged-list { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); overflow: hidden; }
  .flagged-list .row {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #f0f0f0; font-size: 14px;
  }
  .flagged-list .row:last-child { border-bottom: none; }
  .flagged-list .label { font-weight: 600; flex: 1; }
  .flagged-list .why { color: #999; font-size: 12px; }

  .actions {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, #f4f4f2 60%, rgba(244,244,242,0)); display: flex; gap: 10px;
  }
  .actions button {
    flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: #4a90d9; color: #fff; }
  .btn-secondary { background: #fff; color: #333; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .btn-primary:disabled { background: #a9c7e8; }

  .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 14px; }
  .error-banner {
    background: #fdeceb; color: #b23127; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 13px;
  }
</style>

<header>
  <h1>ShelfCheck</h1>
  <div class="section-toggle">
    <button id="btnFiction" class="active">Fiction</button>
    <button id="btnNonfiction">Nonfiction</button>
  </div>
</header>

<main>
  <div id="errorBanner" style="display:none" class="error-banner"></div>
  <div id="summary" class="summary" style="display:none"></div>
  <div id="segments"></div>
  <div id="flaggedWrap" style="display:none">
    <div class="flagged-list" id="flaggedList"></div>
  </div>
  <div id="empty" class="empty">
    Pick Fiction or Nonfiction, then photograph the shelf straight on, close
    enough that the spine labels are readable.<br>
    One photo per shelf — take another for the next shelf.
  </div>
</main>

<div class="actions">
  <button class="btn-secondary" id="btnNewShelf">Clear</button>
  <button class="btn-primary" id="btnAddPhoto">Take / choose photos</button>
</div>
<input type="file" id="photoInput" accept="image/*" multiple style="display:none">

<script type="module">
import { readShelf } from './reader.js';
import { checkOrder, sortKey, compareKeys } from './ordering.js';

const GEMINI_URL = 'https://selfcheck-proxy.krish-sundareswar.workers.dev/';
// Azure Read through the Cloudflare worker that holds the key (workers/azure-ocr-worker.js).
const AZURE_URL = 'https://shelfcheck-azure-ocr.krish-sundareswar.workers.dev/ocr';
// One upload, both engines (workers/read-worker.js); the two URLs above are the fallback.
const READ_URL = 'https://shelfcheck-read.krish-sundareswar.workers.dev/read';

const els = {
  segments: document.getElementById('segments'),
  summary: document.getElementById('summary'),
  flaggedWrap: document.getElementById('flaggedWrap'),
  flaggedList: document.getElementById('flaggedList'),
  empty: document.getElementById('empty'),
  errorBanner: document.getElementById('errorBanner'),
  photoInput: document.getElementById('photoInput'),
  btnAddPhoto: document.getElementById('btnAddPhoto'),
  btnNewShelf: document.getElementById('btnNewShelf'),
  btnFiction: document.getElementById('btnFiction'),
  btnNonfiction: document.getElementById('btnNonfiction'),
};

// One entry per captured photo, each an independent whole shelf:
// { imgUrl, sentW, sentH, books, checked, status, error }. Each book already
// carries the model's shelfRow, so one photo's rows are ordered on their own.
let segments = [];
let section = 'fiction';
let batchWallMs = 0;   // wall-clock time of the last multi-photo batch
let batchCount = 0;    // photos read in that batch

els.btnFiction.onclick = () => setSection('fiction');
els.btnNonfiction.onclick = () => setSection('nonfiction');
function setSection(s) {
  section = s;
  els.btnFiction.classList.toggle('active', s === 'fiction');
  els.btnNonfiction.classList.toggle('active', s === 'nonfiction');
}

els.btnNewShelf.onclick = () => {
  segments = [];
  batchWallMs = 0; batchCount = 0;
  render();
};

els.btnAddPhoto.onclick = () => els.photoInput.click();
els.photoInput.onchange = async () => {
  const files = Array.from(els.photoInput.files || []);
  els.photoInput.value = '';
  if (!files.length) return;
  await addSegments(files);
};

// Decode once, orientation applied. The bitmap goes straight to the reader's
// downscale; the photo on screen is the file itself (an object URL), so no
// full-resolution re-encode happens on the phone just to display it.
async function decode(file) {
  return createImageBitmap(file, { imageOrientation: 'from-image' });
}

// Free-tier proxy rate-limits bursts (4-way concurrency hit 429s in testing),
// so read at most this many photos at once. reader.js retries a 429 with
// backoff, but keeping the burst small avoids most of them in the first place.
const READ_CONCURRENCY = 2;

// Take one or several photos at once. Each is decoded and shown as its own row
// immediately, then read concurrently (capped) so a batch finishes in roughly
// the time of its slowest few reads rather than the sum of all of them.
async function addSegments(files) {
  hideError();
  const batch = [];
  for (const file of files) {
    let seg;
    try {
      const bitmap = await decode(file);
      seg = { bitmap, imgUrl: URL.createObjectURL(file),
              sentW: bitmap.width, sentH: bitmap.height, books: [], status: 'loading' };
    } catch (e) {
      seg = { imgUrl: '', books: [], status: 'error', error: 'could not open this image' };
    }
    segments.push(seg); batch.push(seg);
  }
  render();

  const t0 = performance.now();
  let next = 0;
  const worker = async () => {
    while (next < batch.length) {
      const seg = batch[next++];
      if (seg.status === 'error') continue;   // failed to decode
      await readSegment(seg);
      render();
    }
  };
  await Promise.all(Array.from({ length: Math.min(READ_CONCURRENCY, batch.length) }, worker));

  if (batch.length > 1) {
    batchWallMs = Math.round(performance.now() - t0);
    batchCount = batch.filter(s => s.status === 'done').length;
    render();
  }
}

async function readSegment(seg) {
  try {
    const t0 = performance.now();
    const result = await readShelf(seg.bitmap, section, { readUrl: READ_URL, geminiUrl: GEMINI_URL, azureUrl: AZURE_URL });
    seg.sentW = result.sentW; seg.sentH = result.sentH; seg.section = result.section;
    seg.books = result.books; seg.degraded = result.degraded;
    // Each photo is its own whole shelf: check its rows on their own. The books
    // already carry their shelfRow, and checkOrder groups by it.
    seg.checked = checkOrder(seg.books, result.section);
    seg.elapsedMs = Math.round(performance.now() - t0);
    seg.status = 'done';
    // test-only record for the latency/accuracy harness; nothing in the app reads it
    (window.__shelfcheck ||= []).push({ raw: result.raw, via: result.via, model: result.model, timings: result.timings, elapsedMs: seg.elapsedMs, section: result.section, degraded: result.degraded,
      books: seg.checked.map(b => ({ label: b.spine_label, raw: b._raw, row: b.shelfRow, red: !!b.outOfOrder, unread: isUnreadable(b), box: b._box01, why: b._why || null })) });
  } catch (err) {
    seg.status = 'error'; seg.error = String(err.message || err);
    const kind = err && err.kind;
    const msg = (kind === 'NETWORK' || kind === 'TIMEOUT')
      ? 'Couldn\'t reach the reader — check your connection and tap the photo button to try again.'
      : `Couldn't read that photo: ${seg.error}`;
    showError(msg);
  } finally {
    if (seg.bitmap) { seg.bitmap.close?.(); seg.bitmap = null; }   // free the decoded photo once read
  }
}

// A box means one of exactly two things: the book is in the wrong place (red),
// or its sticker could not be read (yellow). A book whose order evidence was
// too weak to accuse (ordering.js demotes those to possiblyOutOfOrder) gets no
// box -- the volunteer is told only what the app actually knows.
function isUnreadable(b) {
  if (b.outOfOrder || b._extrap || b._edge) return false;   // no box where we cannot place it, or for a spine cut by the frame
  return !!b._unreadable || b._why === 'nokey' || b._why === 'trunc';
}
function flagKind(b) {
  if (b.outOfOrder) return 'red';
  if (isUnreadable(b)) return 'yellow';
  return null;
}

function render() {
  els.empty.style.display = segments.length ? 'none' : '';
  els.segments.innerHTML = '';
  let red = 0, yellow = 0, green = 0;
  let badge = 0;   // flagged books are numbered across all photos; the list below uses the same numbers

  for (const seg of segments) {
    const div = document.createElement('div');
    div.className = 'segment';
    if (seg.status === 'loading') {
      div.innerHTML = `<div class="imgwrap"><img src="${seg.imgUrl}"></div><div class="status">Reading spines…</div>`;
    } else if (seg.status === 'error') {
      div.innerHTML = `<div class="imgwrap"><img src="${seg.imgUrl}"></div><div class="status">⚠ ${escapeHtml(seg.error)}</div>`;
    } else {
      const n = seg.books.length;
      const boxesHtml = seg.books.map((b, i) => {
        const checkedBook = seg.checked ? seg.checked[i] : null;
        const kind = checkedBook ? flagKind(checkedBook) : null;
        if (!kind) return '';                       // only flagged books get a box
        // A whole-shelf photo has several stacked rows, so the box must use the
        // model's real vertical position too, not the full photo height. Pad a
        // hair on every side so a tight box still reads as a frame around the
        // spine rather than a hairline on it.
        const [x, y, w, h] = b._box01 || [i / n, 0, 1 / n, 1];
        const pad = 0.006;
        const left = Math.max(0, x - pad), top = Math.max(0, y - pad);
        const width = Math.min(1 - left, w + pad * 2), height = Math.min(1 - top, h + pad * 2);
        const style = `left:${(left*100).toFixed(2)}%;top:${(top*100).toFixed(2)}%;width:${(width*100).toFixed(2)}%;height:${(height*100).toFixed(2)}%`;
        checkedBook._badge = ++badge;
        return `<div class="box ${kind}" style="${style}"><span>${checkedBook._badge}</span></div>`;
      }).join('');
      for (const b of (seg.checked || [])) {
        const k = flagKind(b);
        if (k === 'red') red++; else if (k === 'yellow') yellow++; else green++;
      }
      div.innerHTML = `
        <div class="imgwrap"><img src="${seg.imgUrl}">${boxesHtml}</div>
        <div class="meta"><span>${n} books${seg.section !== section ? ` · read as ${seg.section}` : ''}${seg.degraded ? ' · box positions approximate' : ''}</span><span>${seg.elapsedMs ? (seg.elapsedMs/1000).toFixed(1)+'s' : ''}</span></div>`;
    }
    els.segments.appendChild(div);
  }

  const total = red + yellow + green;
  if (total > 0) {
    els.summary.style.display = '';
    const batchNote = (batchCount > 1 && batchWallMs)
      ? `<span class="batch-time">${batchCount} photos in ${(batchWallMs/1000).toFixed(1)}s</span>` : '';
    els.summary.innerHTML = `
      <span><span class="dot red"></span><b>${red}</b> out of place</span>
      <span><span class="dot yellow"></span><b>${yellow}</b> couldn't read</span>
      <span><span class="dot green"></span><b>${green}</b> in order</span>
      ${batchNote}`;
  } else {
    els.summary.style.display = 'none';
  }

  const flagged = segments.filter(s => s.status === 'done')
    .flatMap(s => (s.checked || []).map(b => ({ b, seg: s })))
    .filter(({ b }) => flagKind(b));
  if (flagged.length) {
    els.flaggedWrap.style.display = '';
    els.flaggedList.innerHTML = flagged.map(({ b, seg }) => `
      <div class="row">
        <span class="num ${b.outOfOrder ? 'red' : 'yellow'}">${b._badge || ''}</span>
        <span class="label">${escapeHtml(b.spine_label)}</span>
        <span class="why">${b.outOfOrder ? escapeHtml(whereItGoes(b, seg)) : 'sticker unreadable — check by hand'}</span>
      </div>`).join('');
  } else {
    els.flaggedWrap.style.display = 'none';
  }
}

// Where a red book belongs on its shelf: after the last in-order book whose
// label sorts at or before it (same comparator the order check uses).
function whereItGoes(b, seg) {
  const row = (seg.checked || []).filter(o => o.shelfRow === b.shelfRow);
  const kb = sortKey(b, seg.section);
  if (!kb) return 'out of place';
  let after = null, first = null;
  for (const o of row) {
    if (o === b || o.outOfOrder || o._unreadable) continue;
    const ko = sortKey(o, seg.section);
    if (!ko) continue;
    if (!first) first = o;
    if (compareKeys(ko, kb) <= 0) after = o;
  }
  if (after) return `out of place · goes after ${after.spine_label}`;
  if (first) return `out of place · goes before ${first.spine_label}`;
  return 'out of place';
}

function showError(msg) { els.errorBanner.textContent = msg; els.errorBanner.style.display = ''; }
function hideError() { els.errorBanner.style.display = 'none'; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

render();
</script>
