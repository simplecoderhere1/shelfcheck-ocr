<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1c1c1c">
  <title>ShelfCheck</title>
  <!-- Warm up connections to both OCR proxies during page load, so the TLS/DNS
       handshake doesn't sit on the critical path of the first Analyze tap. -->
  <link rel="preconnect" href="https://shelfcheck-ocr-proxy.krish-sundareswar.workers.dev">
  <link rel="preconnect" href="https://selfcheck-proxy.krish-sundareswar.workers.dev">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      height: 100vh; height: 100dvh;
      background: #0d0d0d; color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column;
      overflow: hidden; -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ─────────────────────────────────── */
    .header {
      flex-shrink: 0; display: flex; align-items: center;
      justify-content: space-between; padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: #1c1c1c; border-bottom: 1px solid #2c2c2c;
    }
    .app-name { font-size: 15px; font-weight: 600; letter-spacing: .05em; color: #e0e0e0; }
    .section-tabs { display: flex; background: #2c2c2c; border-radius: 8px; padding: 3px; }
    .tab-btn {
      padding: 5px 14px; border-radius: 6px; border: none; background: transparent;
      color: #888; font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background .18s, color .18s; user-select: none;
    }
    .tab-btn.active { background: #f0f0f0; color: #111; }

    /* ── Camera area ─────────────────────────────── */
    .camera-wrap { flex: 1; position: relative; background: #000; min-height: 0; display: flex; flex-direction: column; }
    .photo-area { flex: 1; position: relative; overflow: hidden; min-height: 0; }

    .photo-placeholder {
      position: absolute; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: #555;
    }
    .photo-placeholder svg { opacity: .45; }

    /* Pop-out highlight shown over a box when it's selected from the flagged list. */
    .box-pulse {
      position: absolute; pointer-events: none; border-radius: 3px;
      border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.5), 0 0 14px 2px currentColor;
      opacity: 0; transform: scale(1); transform-origin: center;
      transition: opacity .15s ease-out;
    }
    .box-pulse.show { opacity: 1; animation: box-pulse-pop 900ms ease-out 1; }
    @keyframes box-pulse-pop {
      0%   { transform: scale(1);    opacity: 0; }
      15%  { transform: scale(1.35); opacity: 1; }
      40%  { transform: scale(0.95); opacity: 1; }
      60%  { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1);    opacity: 1; }
    }
    .photo-placeholder p { font-size: 14px; line-height: 1.6; text-align: center; max-width: 220px; }

    #snapshot {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; display: none;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute; inset: 0; z-index: 25;
      background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; padding: 0 32px;
    }
    .loading-cancel {
      margin-top: 4px; background: rgba(46,46,46,.92); color: #ddd;
      border: 1px solid #555; font-size: 13px; font-weight: 600;
      padding: 9px 22px; border-radius: 10px; cursor: pointer;
    }
    .loading-cancel:active { transform: scale(.96); }

    /* Results overlay */
    .results-overlay {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
      padding: 20px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,.85));
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; pointer-events: none;
    }
    .results-overlay .btn-new-scan { pointer-events: auto; }
    .overlay-badge { font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 20px; }
    .badge-ok           { background: #14532d; color: #4ade80; }
    .badge-warn         { background: #450a0a; color: #f87171; }
    .badge-unverifiable { background: #713f12; color: #fde047; }

    /* Error banner */
    .error-banner {
      position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 26;
      background: #450a0a; border: 1px solid #7f1d1d; border-radius: 12px;
      padding: 12px 14px; display: flex; align-items: center;
      justify-content: space-between; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .error-banner-msg { font-size: 13px; color: #fecaca; line-height: 1.4; }
    .error-banner-retry {
      flex-shrink: 0; background: #ef4444; border: none; color: #fff;
      font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 8px; cursor: pointer;
    }

    /* First-run hint */
    .first-hint {
      position: absolute; inset: 0; z-index: 24;
      background: rgba(0,0,0,.78); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center; padding: 28px;
    }
    .first-hint-card {
      background: #1c1c1c; border: 1px solid #333; border-radius: 16px;
      padding: 22px 20px; max-width: 320px; text-align: left;
    }
    .first-hint-card h3 { font-size: 16px; color: #fff; margin-bottom: 12px; text-align: center; }
    .first-hint-row {
      display: flex; align-items: flex-start; gap: 10px; margin-bottom: 11px;
      font-size: 13px; color: #ccc; line-height: 1.4;
    }
    .first-hint-dot { flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; margin-top: 1px; }
    .first-hint-btn {
      width: 100%; margin-top: 8px; background: #2563eb; border: none;
      color: #fff; font-size: 14px; font-weight: 600; padding: 12px; border-radius: 10px; cursor: pointer;
    }

    .btn-new-scan {
      padding: 10px 20px; border-radius: 10px; font-size: 14px;
      font-weight: 600; border: none; cursor: pointer; background: #2563eb; color: #fff;
    }

    /* Expandable detail row inside flagged list */
    .flagged-item-detail {
      display: none; padding: 8px 14px 10px 33px;
      border-bottom: 1px solid #1a1a1a; background: #0a0a0a;
    }
    .flagged-item-detail.open { display: block; }
    .fi-drow { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; font-size: 12px; }
    .fi-dk { color: #666; flex-shrink: 0; }
    .fi-dv { color: #ccc; text-align: right; word-break: break-word; }
    .fi-dstatus { margin-top: 6px; font-size: 11px; font-weight: 600; }

    /* Debug mode */
    .debug-badge {
      position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      background: #dc2626; color: #fff; font-size: 10px; font-weight: 700;
      letter-spacing: .08em; padding: 2px 8px; border-radius: 6px;
      z-index: 50; pointer-events: none;
    }
    .timing-badge {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 40; background: rgba(0,0,0,.85); border: 1px solid #dc2626;
      color: #fff; font-size: 12px; font-variant-numeric: tabular-nums;
      padding: 8px 14px; border-radius: 10px; text-align: center; line-height: 1.5;
    }
    .timing-badge b { color: #f87171; }

    /* Small non-blocking pill: first results are shown, the other engine is still refining */
    .refining-badge {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 39; background: rgba(20,20,20,.9); border: 1px solid #333;
      color: #aaa; font-size: 12px; padding: 6px 12px; border-radius: 20px;
      display: flex; align-items: center; gap: 4px; pointer-events: none;
      animation: refiningFadeIn .2s ease-out;
    }
    @keyframes refiningFadeIn { from { opacity: 0; transform: translate(-50%, -4px); } to { opacity: 1; transform: translate(-50%, 0); } }

    .settings-btn {
      background: transparent; border: none; color: #888; font-size: 18px;
      cursor: pointer; padding: 4px; line-height: 1; transition: color .15s;
    }
    .settings-btn:active { color: #fff; }
    .settings-btn.debug-active { color: #dc2626; }
    .settings-menu {
      display: none; position: absolute; top: 100%; right: 0; margin-top: 4px;
      background: #1c1c1c; border: 1px solid #333; border-radius: 10px;
      padding: 8px 0; z-index: 50; min-width: 180px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .settings-menu.show { display: block; }
    .settings-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; font-size: 13px; color: #ddd; cursor: pointer; user-select: none;
    }
    .settings-item:active { background: #2c2c2c; }
    .settings-toggle {
      width: 36px; height: 20px; border-radius: 10px; background: #444;
      position: relative; transition: background .2s; flex-shrink: 0;
    }
    .settings-toggle.on { background: #dc2626; }
    .settings-toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s;
    }
    .settings-toggle.on::after { transform: translateX(16px); }

    /* Debug table overlay */
    .debug-overlay {
      position: absolute; inset: 0; z-index: 25; background: #0d0d0d;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .debug-section { padding: 12px 16px; border-bottom: 1px solid #2c2c2c; }
    .debug-section-title {
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: #888; margin-bottom: 8px;
    }
    .debug-book-table { width: 100%; font-size: 11.5px; border-collapse: collapse; }
    .debug-book-table th {
      text-align: left; color: #888; font-weight: 600; padding: 6px 8px;
      border-bottom: 1px solid #333; position: sticky; top: 0; background: #0d0d0d;
    }
    .debug-book-table td {
      padding: 6px 8px; border-bottom: 1px solid #1c1c1c; color: #ddd;
      vertical-align: top; max-width: 120px; overflow: hidden; text-overflow: ellipsis;
    }
    .debug-book-table tr.book-ok  td:first-child { border-left: 3px solid #4ade80; }
    .debug-book-table tr.book-bad td:first-child { border-left: 3px solid #ef4444; }
    .debug-book-table tr.book-unv td:first-child { border-left: 3px solid #eab308; }
    .debug-actions {
      display: flex; gap: 8px; padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    .debug-actions .btn { flex: 1; }

    /* Pick buttons (idle state) */
    .pick-btns {
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; width: 100%; max-width: 300px; padding: 0 24px;
    }
    .pick-btn {
      width: 100%; padding: 16px 20px; border-radius: 14px; font-size: 16px;
      font-weight: 600; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 10px; transition: transform .12s ease, opacity .12s;
    }
    .pick-btn:active { transform: scale(.97); opacity: .85; }
    .pick-btn-camera { background: #2563eb; color: #fff; }
    .pick-btn-upload { background: #2e2e2e; color: #ccc; }

    /* Action bar */
    .action-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: none; align-items: center; gap: 12px;
      padding: 20px 16px; padding-bottom: max(20px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(0,0,0,.72)); z-index: 21;
    }
    .action-bar.show { display: flex; }
    .btn {
      flex: 1; padding: 13px 16px; border-radius: 10px; font-size: 15px;
      font-weight: 600; border: none; cursor: pointer; transition: transform .1s ease;
    }
    .btn:active { transform: scale(.96); }
    .btn-retake  { background: rgba(46,46,46,.92); color: #ddd; }
    .btn-analyze { background: #2563eb; color: #fff; }
    .btn-analyze:disabled { background: #1a2f5e; color: #4e71b5; cursor: not-allowed; transform: none; }

    /* Flagged list */
    .flagged-list {
      display: none; flex-direction: column; background: #111;
      border-top: 1px solid #2c2c2c; overflow-y: auto;
      -webkit-overflow-scrolling: touch; max-height: 200px; flex-shrink: 0;
      opacity: 0; transition: opacity .18s ease-out;
    }
    .flagged-list.show { display: flex; opacity: 1; }
    .flagged-list-success {
      display: flex; align-items: center; gap: 10px; padding: 14px;
      font-size: 13px; color: #86efac; line-height: 1.4;
    }
    .flagged-list-success-icon {
      flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
      background: #14532d; color: #4ade80; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .flagged-list-header {
      padding: 8px 14px 6px; font-size: 11px; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase; color: #555;
      flex-shrink: 0; position: sticky; top: 0; background: #111; border-bottom: 1px solid #1e1e1e;
    }
    .flagged-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; border-bottom: 1px solid #1a1a1a;
      cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
      transition: background .12s;
    }
    .flagged-item:active { background: #1e1e1e; }
    .flagged-item.active { background: #162316; }
    .flagged-item-dot { flex-shrink: 0; width: 9px; height: 9px; border-radius: 50%; }
    .flagged-item-dot-bad { background: #ef4444; }
    .flagged-item-dot-unv { background: #eab308; }
    .flagged-item-text { flex: 1; min-width: 0; }
    .flagged-item-label { font-size: 13px; font-weight: 600; color: #e2e2e2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flagged-item-title { font-size: 12px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; font-style: italic; }
    .flagged-item-sub { font-size: 11px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .flagged-item-status { flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; }
    .flagged-item-status-bad { background: #450a0a; color: #f87171; }
    .flagged-item-status-unv { background: #713f12; color: #fde047; }

    /* Stage-based loading */
    .stage-list { display: flex; flex-direction: column; gap: 13px; width: 100%; max-width: 220px; }
    .stage-row { display: flex; align-items: center; gap: 10px; }
    .stage-icon { width: 16px; text-align: center; font-size: 12px; flex-shrink: 0; color: rgba(255,255,255,.4); }
    .stage-label { font-size: 14px; font-weight: 600; color: rgba(255,255,255,.4); transition: color .2s; }
    .stage-row.s-done .stage-icon, .stage-row.s-done .stage-label { color: #4ade80; }
    .stage-row.s-active .stage-icon, .stage-row.s-active .stage-label { color: #fff; }
    .anim-dots span { animation: dotPulse 1.2s ease-in-out infinite; opacity: .2; }
    .anim-dots span:nth-child(2) { animation-delay: .2s; }
    .anim-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dotPulse { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

    /* Landscape layout */
    @media (orientation: landscape) {
      body { flex-direction: row; }
      .header {
        flex-direction: column; width: auto; border-bottom: none;
        border-right: 1px solid #2c2c2c; padding: 8px;
        padding-top: max(8px, env(safe-area-inset-top));
        padding-left: max(8px, env(safe-area-inset-left));
        gap: 10px; justify-content: flex-start; align-items: center;
      }
      .app-name { display: none; }
      .section-tabs { flex-direction: column; }
      .tab-btn { padding: 6px 10px; font-size: 12px; }
      .pick-btns { flex-direction: row; max-width: none; padding: 0 16px; }
      .action-bar { flex-direction: row; }
    }

    /* Live camera */
    .camera-live { display: none; position: fixed; inset: 0; z-index: 70; background: #000; overflow: hidden; touch-action: none; }
    .camera-live.show { display: block; }
    .camera-live video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: center center; }
    .cam-message { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 3; font-size: 13px; font-weight: 600; color: #fff; background: rgba(0,0,0,.5); padding: 6px 14px; border-radius: 20px; max-width: min(92vw, 420px); text-align: center; white-space: normal; pointer-events: none; transition: opacity .2s ease; }
    .cam-close { position: absolute; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); z-index: 3; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,.5); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; }

    /* Live AR: a transparent overlay canvas sits on top of the still-playing
       camera video. Boxes from the last completed analysis are drawn onto it
       and repositioned every frame by a lightweight motion tracker (see
       arTrackTick) so they visually track the camera between analysis
       cycles — the video itself never freezes. */
    #arLiveOverlay { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    /* Tapping a green/grey box (no list row to open) pops this instead —
       a small floating readout of what was read, positioned by JS next to
       the tapped box. */
    .ar-caption {
      display: none; position: absolute; z-index: 4; max-width: 220px;
      background: rgba(17,17,17,.92); color: #fff; font-size: 12px; font-weight: 600;
      padding: 5px 9px; border-radius: 7px; pointer-events: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.4); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .ar-caption.show { display: block; }
    .ar-sheet {
      display: none; position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
      flex-direction: column; background: #111; border-top: 1px solid #2c2c2c;
      border-radius: 14px 14px 0 0; max-height: 42%; overflow-y: auto;
      -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom);
      opacity: 0; transition: opacity .18s ease-out;
    }
    .ar-sheet.show { display: flex; opacity: 1; }
  </style>
  <!-- COOP/COEP shim: enables crossOriginIsolated on GitHub Pages so the
       local OCR engine can use multi-threaded WASM (one reload, first visit only). -->
  <script src="coi-serviceworker.min.js"></script>
  <script src="ocr_local.js" defer></script>
</head>
<body>

<header class="header">
  <span class="app-name">ShelfCheck</span>
  <div class="section-tabs" role="tablist" aria-label="Collection section">
    <button class="tab-btn active" data-section="fiction"    role="tab" aria-selected="true"  aria-label="Fiction collection">Fiction</button>
    <button class="tab-btn"        data-section="nonfiction" role="tab" aria-selected="false" aria-label="Nonfiction collection">Nonfiction</button>
  </div>
  <div style="position:relative">
    <button class="settings-btn" id="settingsBtn" aria-label="Settings" aria-haspopup="true" aria-expanded="false">&#9881;</button>
    <div class="settings-menu" id="settingsMenu" role="menu" aria-label="Settings">
      <div class="settings-item" id="debugToggle" role="menuitemcheckbox" aria-checked="false" tabindex="0">
        <span>Debug Mode</span>
        <div class="settings-toggle" id="debugToggleSwitch"></div>
      </div>
      <div class="settings-item" id="geminiToggle" role="menuitemcheckbox" aria-checked="true" tabindex="0">
        <span>On-device AI OCR</span>
        <div class="settings-toggle" id="geminiToggleSwitch"></div>
      </div>
      <div style="padding:10px 16px;border-top:1px solid #2c2c2c">
        <div style="font-size:11px;color:#555;line-height:1.5">On-device AI OCR (PP-OCR)<br>+ ocr.space via Cloudflare proxy</div>
      </div>
    </div>
  </div>
</header>

<div class="camera-wrap" id="cameraWrap">
  <div class="photo-area" id="photoArea">
    <div class="photo-placeholder" id="photoPlaceholder">
      <div class="pick-btns">
        <button class="pick-btn pick-btn-camera" id="takePicBtn" aria-label="Take photo with camera">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          Take Photo
        </button>
        <button class="pick-btn pick-btn-upload" id="uploadPicBtn" aria-label="Upload an existing image">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
            <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
            <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
          </svg>
          Upload Image
        </button>
        <p style="font-size:12px;color:#888;text-align:center;line-height:1.5;padding:0 8px">
          Hold your phone <strong>upright</strong> and pan across the shelf — get close enough that the label stickers are sharp.
        </p>
      </div>
    </div>
    <canvas id="snapshot" role="img" aria-label="Captured shelf photo"></canvas>
    <div class="box-pulse" id="boxPulse"></div>
    <div class="action-bar" id="actionBar">
      <button class="btn btn-retake"  id="retakeBtn" aria-label="Retake photo">Retake</button>
      <button class="btn btn-analyze" id="analyzeBtn" disabled aria-label="Analyze shelf photo">Analyze</button>
    </div>
  </div>
  <div class="flagged-list" id="flaggedList" role="region" aria-label="Flagged books"></div>
</div>

<div class="camera-live" id="cameraLive" role="dialog" aria-label="Camera">
  <video id="cameraVideo" playsinline autoplay muted aria-hidden="true"></video>
  <canvas id="arLiveOverlay" aria-hidden="true"></canvas>
  <div class="box-pulse" id="arBoxPulse"></div>
  <div class="ar-caption" id="arCaption"></div>
  <div class="cam-message" id="camMessage">Point at a shelf row — scanning automatically</div>
  <button class="cam-close" id="camClose" aria-label="Close camera">&times;</button>
  <div class="ar-sheet" id="arSheet" role="region" aria-label="Flagged books"></div>
</div>

<input type="file" id="photoInput"  accept="image/*" capture="environment" style="display:none">
<input type="file" id="uploadInput" accept="image/*" style="display:none">

<script>
  // ── DOM refs ────────────────────────────────────────────────────────────
  const photoInput        = document.getElementById('photoInput');
  const uploadInput       = document.getElementById('uploadInput');
  const photoPlaceholder  = document.getElementById('photoPlaceholder');
  const takePicBtn        = document.getElementById('takePicBtn');
  const uploadPicBtn      = document.getElementById('uploadPicBtn');
  const snapshot          = document.getElementById('snapshot');
  const actionBar         = document.getElementById('actionBar');
  const retakeBtn         = document.getElementById('retakeBtn');
  const analyzeBtn        = document.getElementById('analyzeBtn');
  const cameraWrap        = document.getElementById('cameraWrap');
  const photoArea         = document.getElementById('photoArea');

  // ── OCR proxy ────────────────────────────────────────────────────────────
  // All OCR calls go through a Cloudflare Worker that injects the ocr.space API key.
  // Replace this URL with your own Worker URL after deploying worker/index.js.
  const WORKER_URL = 'https://shelfcheck-ocr-proxy.krish-sundareswar.workers.dev';
  const OCR_TIMEOUT_MS = 20000;

  // Local OCR (ocr_local.js): PP-OCRv6 det+rec running in the browser via
  // onnxruntime-web (WebGPU with WASM fallback). Fully free, no quota, no
  // network after the one-time ~31MB model download (Cache API). Validated at
  // 96% recall on the 10-image ground truth (test_items/bench_js_port.py).
  // It races ocr.space on every scan: first success renders, the other fuses
  // in as a background refine, and a scan only fails when BOTH are down.
  const OL_TIMEOUT_MS = 4000;   // Open Library is third-party; never let one slow request stall analysis
  let localOcrEnabled = (localStorage.getItem('shelfcheck.localocr') ?? '1') === '1';

  // ── State ────────────────────────────────────────────────────────────────
  const MAX_CANVAS_DIM = 4096;   // keep native resolution — nonfiction tiles need it
  let pendingEncode    = null;   // Promise<{blob, sentW, sentH}> — pre-encodes while user reads photo
  let pendingTiles      = null;  // Promise<{tiles, canvas}> — pre-encoded nonfiction tiles, same idea
  let pendingLocal      = null;  // Promise<books|null> — speculative local OCR, same idea
  let lastRawBooks     = null;
  let lastCheckedBooks = [];
  let lastApiDims      = null;   // {sentW, sentH} of the image sent to OCR
  let _flaggedRowMap   = new Map();  // book object → flagged-list DOM row
  let _cleanPhotoData  = null;   // ImageData snapshot of the photo before any boxes are drawn
  let analysisCancelled = false;
  let analysisAbort     = null;
  let analysisGeneration = 0;   // bumped on every new analysis/retake so a late refine can't clobber stale UI

  // ── Section toggle ────────────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      try { localStorage.setItem('shelfcheck.section', btn.dataset.section); } catch {}
      if (lastRawBooks && document.getElementById('resultsOverlay')) {
        showResults(lastRawBooks, btn.dataset.section);
      }
    });
  });
  try {
    const saved = localStorage.getItem('shelfcheck.section');
    if (saved) {
      const b = document.querySelector(`.tab-btn[data-section="${saved}"]`);
      if (b) {
        document.querySelectorAll('.tab-btn').forEach(x => { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); });
        b.classList.add('active'); b.setAttribute('aria-selected', 'true');
      }
    }
  } catch {}

  function getSection() { return document.querySelector('.tab-btn.active').dataset.section; }

  // ── Photo loading ─────────────────────────────────────────────────────────
  function loadPhoto(file) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async () => {
      const scale = Math.min(1, MAX_CANVAS_DIM / Math.max(img.naturalWidth, img.naturalHeight));
      snapshot.width  = Math.round(img.naturalWidth  * scale);
      snapshot.height = Math.round(img.naturalHeight * scale);
      snapshot.getContext('2d').drawImage(img, 0, 0, snapshot.width, snapshot.height);
      URL.revokeObjectURL(url);
      saveCleanPhoto();
      photoPlaceholder.style.display = 'none';
      snapshot.style.display = 'block';
      actionBar.classList.add('show');
      analyzeBtn.disabled = false;
      // Let the preview actually paint before kicking off the speculative
      // pre-encode below — encodeForOCR/encodeTilesForOCR both do real
      // synchronous canvas work (filter + drawImage) before their first
      // await, which would otherwise block this same paint.
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      pendingEncode = encodeForOCR();
      pendingTiles  = getSection() === 'nonfiction' ? encodeTilesForOCR() : null;
      // Speculatively run the local engine while the user reviews the photo —
      // det + rec (and any first-scan GPU shader compile) hide behind the
      // review pause, so Analyze usually has local results waiting in memory.
      if (localOcrEnabled && window.LocalOCR && LocalOCR.available()) {
        pendingLocal = callLocalOcr(snapshot, null).catch(() => null);
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      showErrorBanner("Couldn't open that image — try another photo (JPEG or PNG).", retake);
    };
    img.src = url;
  }

  function retake() {
    snapshot.style.display = 'none';
    photoPlaceholder.style.display = '';
    actionBar.classList.remove('show');
    document.getElementById('boxPulse')?.classList.remove('show');
    analyzeBtn.disabled    = true;
    analyzeBtn.textContent = 'Analyze';
    photoInput.value  = '';
    uploadInput.value = '';
    pendingEncode    = null;
    pendingTiles     = null;
    pendingLocal     = null;
    _cleanPhotoData  = null;
    lastApiDims      = null;
    lastRawBooks     = null;
    lastCheckedBooks = [];
    analysisGeneration++;   // invalidate any in-flight refine
    hideRefiningBadge();
    document.getElementById('errorBanner')?.remove();
  }

  // ── Clean-photo save/restore (for re-drawing boxes on tab switch) ─────────
  function saveCleanPhoto() {
    _cleanPhotoData = snapshot.getContext('2d').getImageData(0, 0, snapshot.width, snapshot.height);
  }

  function restoreCleanPhoto() {
    if (_cleanPhotoData && _cleanPhotoData.width === snapshot.width)
      snapshot.getContext('2d').putImageData(_cleanPhotoData, 0, 0);
  }

  takePicBtn.addEventListener('click', () => openLiveCamera());

  // ── Live in-app camera ────────────────────────────────────────────────────
  const cameraLive   = document.getElementById('cameraLive');
  const cameraVideo  = document.getElementById('cameraVideo');
  const camClose     = document.getElementById('camClose');
  const arLiveOverlay = document.getElementById('arLiveOverlay');
  const arSheet      = document.getElementById('arSheet');
  const camMessage   = document.getElementById('camMessage');
  let cameraStream  = null;
  let camZoom       = 1;

  function setZoom(z) {
    camZoom = Math.min(4, Math.max(1, z));
    cameraVideo.style.transform = `scale(${camZoom})`;
  }

  // Sticker text is tiny relative to the whole frame, and a browser is free
  // to silently negotiate a getUserMedia video stream down to something like
  // 640x480 under a bare "ideal" hint even on hardware that supports far
  // more — there's no floor unless one is asked for. Try progressively
  // lower resolution floors (not just "ideal") until one is accepted, and
  // ask for a modest frame rate throughout: the live loop only needs the
  // video smooth enough for cheap motion tracking (see arTrackTick), not a
  // full 30fps, and relaxing frame rate lets some phones unlock a higher
  // resolution mode on the same camera.
  const AR_RES_STAGES = [
    { width: { min: 3840 }, height: { min: 2160 } },
    { width: { min: 2560 }, height: { min: 1440 } },
    { width: { min: 1920 }, height: { min: 1080 } },
    { width: { min: 1280 }, height: { min: 720 } },
    {},   // last resort: whatever the device/browser defaults to
  ];

  async function openLiveCamera() {
    if (!navigator.mediaDevices?.getUserMedia) { photoInput.click(); return; }
    let stream = null;
    for (const res of AR_RES_STAGES) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, frameRate: { ideal: 15, max: 24 }, ...res },
          audio: false,
        });
        break;
      } catch { /* try the next, lower-floor stage */ }
    }
    if (!stream) { photoInput.click(); return; }
    cameraStream = stream;
    cameraVideo.srcObject = stream;
    setZoom(1);
    cameraLive.classList.add('show');
    try { await cameraVideo.play(); } catch {}
    const settings = stream.getVideoTracks()[0]?.getSettings?.() || {};
    console.log(`[perf] openLiveCamera: negotiated ${settings.width}x${settings.height} @ ${settings.frameRate || '?'}fps ` +
                `(video element reports ${cameraVideo.videoWidth}x${cameraVideo.videoHeight})`);
    arSetupImageCapture(stream);
    arPreloadWithProgress();
    startArLoop();
  }

  // Kick off (don't await) the on-device reader warm-up the moment the camera
  // opens, surfacing the one-time ~31MB model download as a visible progress
  // line so a cold first-run doesn't look frozen. Idempotent/memoized in
  // ocr_local.js, so a warm profile resolves instantly with no progress calls
  // (cachedFetch only reports progress on a real network fetch). Guarded on
  // arActive so a mid-download camera close can't resurrect stale messages.
  function arPreloadWithProgress() {
    if (!(localOcrEnabled && window.LocalOCR && LocalOCR.available())) return;
    const prog = {};
    LocalOCR.preload((url, got, total) => {
      prog[url] = { got, total };
      let g = 0, t = 0;
      for (const k in prog) { g += prog[k].got; t += prog[k].total; }
      if (t && arActive && cameraLive.classList.contains('show') && !arLastBoxes.length) {
        camMessage.textContent = `Preparing reader… ${Math.min(99, Math.round(g / t * 100))}%`;
      }
    }).then(
      () => { if (arActive && !arLastBoxes.length) camMessage.textContent = 'Point at a shelf row — scanning automatically'; },
      () => { if (arActive) camMessage.textContent = 'Reader unavailable — using online service'; }
    );
  }

  // Progressive enhancement: ImageCapture.takePhoto() pulls a genuine
  // photographic still from the camera hardware — meaningfully higher
  // resolution than the live preview stream on devices that support it
  // (Chrome/Android). Safari on iOS doesn't implement ImageCapture at all,
  // so this silently stays null there and arScanCycle keeps using the video-
  // frame grab it already had, same as before — never worse, sometimes
  // considerably better.
  let arImageCapture = null;
  function arSetupImageCapture(stream) {
    arImageCapture = null;
    if (typeof ImageCapture === 'undefined') return;
    try { arImageCapture = new ImageCapture(stream.getVideoTracks()[0]); } catch { arImageCapture = null; }
  }

  // Grab the frame to analyze this cycle: a real high-res still via
  // ImageCapture where available, otherwise the current live video frame.
  // Returns null on total failure (caller falls back to the video frame).
  async function arGrabStillPhoto() {
    if (!arImageCapture) return null;
    try {
      const blob = await arImageCapture.takePhoto();
      const bmp = await createImageBitmap(blob);
      return bmp;
    } catch { return null; }
  }

  function closeLiveCamera() {
    const hadResults = arActive && lastRawBooks && lastRawBooks.length;
    stopArLoop();
    cameraLive.classList.remove('show');
    if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
    cameraVideo.srcObject = null;
    // Clear any lingering AR-context error banner so it can't resurface as a
    // stale child the next time cameraLive is reopened.
    if (cameraLive.contains(document.getElementById('errorBanner'))) {
      document.getElementById('errorBanner')?.remove();
    }

    if (hadResults) {
      // Hand off to the classic still-photo view — snapshot already holds
      // the last frame the live loop analyzed (and its results).
      photoPlaceholder.style.display = 'none';
      snapshot.style.display = 'block';
      showResults(lastRawBooks, getSection());
    } else {
      actionBar.classList.add('show');
      analyzeBtn.disabled = false;
    }
  }

  // Pure math: what region of the video frame is currently on screen, in
  // video-pixel space, accounting for the cover-fit + pinch zoom. Returns
  // null if the camera isn't ready yet. Shared by the live AR loop below.
  function computeCaptureRect() {
    const vw = cameraVideo.videoWidth, vh = cameraVideo.videoHeight;
    const dispW = cameraLive.clientWidth, dispH = cameraLive.clientHeight;
    if (!vw || !vh) return null;
    const cover = Math.max(dispW / vw, dispH / vh);
    const eff   = cover * camZoom;
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const toVX  = px => vw / 2 + (px - dispW / 2) / eff;
    const toVY  = py => vh / 2 + (py - dispH / 2) / eff;
    const sx  = clamp(toVX(0),     0, vw), sx2 = clamp(toVX(dispW), 0, vw);
    const sy  = clamp(toVY(0),     0, vh), sy2 = clamp(toVY(dispH), 0, vh);
    return { sx, sy, sw: Math.max(1, sx2 - sx), sh: Math.max(1, sy2 - sy) };
  }

  // ── Live AR: continuous scanning, no shutter ─────────────────────────────
  // Google Lens/Word Lens play the same trick: a slow, accurate recognition
  // pass runs asynchronously in the background (can take multiple seconds),
  // while a cheap per-frame visual tracker drags the LAST pass's boxes along
  // with the camera in between, so the overlay never looks frozen even
  // though the actual text reading isn't running anywhere near 60fps.
  // (Google's own patent for this: US20140112527A1.) The full det+rec
  // pipeline and every flag-safety rule are reused completely unchanged —
  // only the on-screen box POSITION between analyses is ever approximated.
  let arLoopToken   = 0;     // bumped on stop/restart so a stale cycle can't apply results after the fact
  let arLastBoxes   = [];    // [{bbox:[vx,vy,vw,vh] in video-pixel space, book, color, dashed, index, _overlayRect}]
  let arKeyLuma     = null;  // Uint8ClampedArray — downsampled grayscale of the frame the last analysis used
  let arMotion      = { dx: 0, dy: 0 };  // accumulated video-px drift since arKeyLuma was captured
  let arTrackHandle = null;
  let arLumaScratch = null;

  // Det-only fast path: grey "seen, still reading" boxes that appear near-
  // instantly (one cheap detection pass) long before the full det+rec+fusion
  // read result lands. They live in the SAME video-pixel reference frame as
  // the read boxes (arLastBoxes) — anchored to arKeyLuma, dragged by arMotion —
  // so the single motion tracker moves both. When a read result overlaps a
  // det box, the read box wins and the det box is suppressed at render time,
  // giving an in-place grey→green/red/yellow transition with no flicker.
  let arDetBoxes    = [];    // [{bbox:[vx,vy,vw,vh] in the arKeyLuma reference frame}]
  let arDetBusy     = false; // a det pass is in flight
  let arScanBusy    = false; // a full read cycle is using the ORT session (det must wait its turn)
  let arDetHandle   = null;  // setTimeout handle for the det sub-loop
  let arDetScratch  = null;
  let arRemoteDown  = false; // last attempted remote OCR call failed → flags paused
  let arLastRemoteAt = 0;    // perf-clock time of the last remote OCR attempt (throttle)

  const AR_TRACK_W = 96, AR_TRACK_H = 72, AR_SEARCH = 14;
  const AR_DET_INTERVAL_MS = 400;      // cadence of the det-only sub-loop
  const AR_DET_MAX_SIDE = 1600;        // scratch canvas size for the det pass
  const AR_REMOTE_MIN_INTERVAL_MS = 20000;  // at most one ocr.space call per 20s during continuous AR

  // Downsampled grayscale of the currently-visible capture region — cheap
  // enough to recompute every frame (a few thousand pixels).
  function arGrabLuma(rect) {
    const c = arLumaScratch || (arLumaScratch = document.createElement('canvas'));
    c.width = AR_TRACK_W; c.height = AR_TRACK_H;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(cameraVideo, rect.sx, rect.sy, rect.sw, rect.sh, 0, 0, AR_TRACK_W, AR_TRACK_H);
    const px = ctx.getImageData(0, 0, AR_TRACK_W, AR_TRACK_H).data;
    const n = AR_TRACK_W * AR_TRACK_H;
    const luma = new Uint8ClampedArray(n);
    for (let i = 0; i < n; i++) {
      const o = i * 4;
      luma[i] = (px[o] * 0.299 + px[o + 1] * 0.587 + px[o + 2] * 0.114) | 0;
    }
    return luma;
  }

  // Coarse global motion estimate between two downsampled grayscale frames:
  // sum-of-absolute-differences block match over a small search window, on a
  // strided pixel sample. Deliberately a single rigid (dx,dy) for the whole
  // frame rather than per-feature optical flow — good enough for panning
  // across a shelf, and far simpler (and less failure-prone) to get right
  // than a full tracker.
  function arEstimateMotion(prevLuma, curLuma) {
    let bestDx = 0, bestDy = 0, bestScore = Infinity;
    const W = AR_TRACK_W, H = AR_TRACK_H, R = AR_SEARCH;
    for (let dy = -R; dy <= R; dy += 2) {
      for (let dx = -R; dx <= R; dx += 2) {
        let sad = 0, cnt = 0;
        for (let y = R; y < H - R; y += 3) {
          const rowPrev = y * W, rowCur = (y + dy) * W;
          for (let x = R; x < W - R; x += 3) {
            sad += Math.abs(prevLuma[rowPrev + x] - curLuma[rowCur + x + dx]);
            cnt++;
          }
        }
        const score = sad / cnt;
        if (score < bestScore) { bestScore = score; bestDx = dx; bestDy = dy; }
      }
    }
    return { dx: bestDx, dy: bestDy };
  }

  // Map a point in full video-frame pixel space to the overlay canvas's own
  // pixel space, given the current cover-fit + pinch zoom (the inverse of
  // computeCaptureRect's toVX/toVY math).
  function arVideoToOverlay(vx, vy) {
    const vw = cameraVideo.videoWidth, vh = cameraVideo.videoHeight;
    const dispW = cameraLive.clientWidth, dispH = cameraLive.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    const cover = Math.max(dispW / vw, dispH / vh);
    const eff = cover * camZoom;
    return [
      (dispW / 2 + (vx - vw / 2) * eff) * dpr,
      (dispH / 2 + (vy - vh / 2) * eff) * dpr,
    ];
  }

  function arRenderOverlay() {
    const dpr = window.devicePixelRatio || 1;
    const cw = Math.max(1, Math.round(cameraLive.clientWidth  * dpr));
    const ch = Math.max(1, Math.round(cameraLive.clientHeight * dpr));
    if (arLiveOverlay.width !== cw || arLiveOverlay.height !== ch) {
      arLiveOverlay.width = cw; arLiveOverlay.height = ch;
    }
    const ctx = arLiveOverlay.getContext('2d');
    ctx.clearRect(0, 0, cw, ch);
    if (!arLastBoxes.length && !arDetBoxes.length) return;
    const lw = Math.max(2, Math.round(cw / 260));
    const fs = Math.max(11, Math.round(cw / 40));
    ctx.font = `bold ${fs}px sans-serif`;
    ctx.textBaseline = 'bottom';
    for (const entry of arLastBoxes) {
      const [vx, vy, vw2, vh2] = entry.bbox;
      const [x0, y0] = arVideoToOverlay(vx + arMotion.dx, vy + arMotion.dy);
      const [x1, y1] = arVideoToOverlay(vx + vw2 + arMotion.dx, vy + vh2 + arMotion.dy);
      const bx = Math.min(x0, x1), by = Math.min(y0, y1);
      const bw = Math.abs(x1 - x0), bh = Math.abs(y1 - y0);
      entry._overlayRect = [bx, by, bw, bh];
      // Every book gets a thin outline (never filled) so the spine stays
      // readable underneath — red misshelved, grey unconfirmed, green
      // confidently correct. Only flagged boxes get a number badge, matching
      // the "box N" the flagged-list rows show — a solid green wall of
      // badges on a 40-book shelf would be pure clutter for boxes that don't
      // have a corresponding list row to point at anyway.
      ctx.strokeStyle = entry.color; ctx.lineWidth = lw;
      if (entry.dashed) ctx.setLineDash([6, 4]);
      ctx.strokeRect(bx, by, bw, bh);
      ctx.setLineDash([]);
      if (entry.index != null) {
        const num = String(entry.index);
        const tw = ctx.measureText(num).width;
        ctx.fillStyle = entry.color; ctx.globalAlpha = 0.85;
        ctx.fillRect(bx, by - fs - 3, tw + 6, fs + 3);
        ctx.globalAlpha = 1; ctx.fillStyle = '#000';
        ctx.fillText(num, bx + 3, by - 2);
      }
    }

    // Det-only "seen, still reading" boxes: thin grey dashed outlines, no
    // badge. Drawn AFTER (under, visually) the read boxes and only where they
    // don't overlap one — an overlapping read box means that sticker has now
    // been read, so its coloured box supersedes the grey placeholder in place.
    let detSuppressed = 0;
    if (arDetBoxes.length) {
      const overlapsRead = (d) => {
        const [vx, vy, vw2, vh2] = d.bbox;
        const cx = vx + vw2 / 2, cy = vy + vh2 / 2;
        return arLastBoxes.some(en => {
          const [ex, ey, ew, eh] = en.bbox;
          if (cx >= ex && cx <= ex + ew && cy >= ey && cy <= ey + eh) return true;
          const ix = Math.max(0, Math.min(vx + vw2, ex + ew) - Math.max(vx, ex));
          const iy = Math.max(0, Math.min(vy + vh2, ey + eh) - Math.max(vy, ey));
          const inter = ix * iy, uni = vw2 * vh2 + ew * eh - inter;
          return uni > 0 && inter / uni > 0.3;
        });
      };
      const dlw = Math.max(1, Math.round(lw * 0.6));
      ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = dlw; ctx.setLineDash([6, 4]);
      for (const d of arDetBoxes) {
        if (overlapsRead(d)) { detSuppressed++; continue; }
        const [vx, vy, vw2, vh2] = d.bbox;
        const [x0, y0] = arVideoToOverlay(vx + arMotion.dx, vy + arMotion.dy);
        const [x1, y1] = arVideoToOverlay(vx + vw2 + arMotion.dx, vy + vh2 + arMotion.dy);
        ctx.strokeRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
      }
      ctx.setLineDash([]);
    }
    // Test/telemetry hook: last overlay composition (read boxes, det boxes,
    // and how many det boxes were superseded in place by an overlapping read).
    window.__arOverlayStats = { readBoxes: arLastBoxes.length, detBoxes: arDetBoxes.length, detSuppressed };
  }

  // Draw the currently-visible capture region into a scratch canvas for the
  // det-only pass. Higher-res than the tiny motion-tracking luma grab (sticker
  // text needs the detail) but capped so a single det pass stays cheap.
  function arGrabDetFrame(rect) {
    const sc = Math.min(1, AR_DET_MAX_SIDE / Math.max(rect.sw, rect.sh));
    const w = Math.max(32, Math.round(rect.sw * sc));
    const h = Math.max(32, Math.round(rect.sh * sc));
    const c = arDetScratch || (arDetScratch = document.createElement('canvas'));
    c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(cameraVideo, rect.sx, rect.sy, rect.sw, rect.sh, 0, 0, w, h);
    return c;
  }

  // The det-only sub-loop: every ~400ms, when the ORT session isn't busy with a
  // full read cycle, run a single detection pass and refresh the grey boxes.
  // Anchored into the arKeyLuma reference frame (subtract the current motion
  // drift) so the tracker drags them exactly like the read boxes.
  async function arDetTick() {
    if (!arActive) return;
    if (!arDetBusy && !arScanBusy && cameraVideo.videoWidth &&
        localOcrEnabled && window.LocalOCR && LocalOCR.available()) {
      arDetBusy = true;
      try {
        const rect = computeCaptureRect();
        if (rect) {
          const mdx = arMotion.dx, mdy = arMotion.dy;
          const boxes = await LocalOCR.detect(arGrabDetFrame(rect));
          if (arActive && boxes.length) {
            arDetBoxes = boxes.map(o => {
              const [fx, fy, fw, fh] = o.bboxFrac;
              return { bbox: [
                rect.sx + fx * rect.sw - mdx, rect.sy + fy * rect.sh - mdy,
                fw * rect.sw, fh * rect.sh,
              ] };
            });
            window.__arDetRenders = (window.__arDetRenders || 0) + 1;
            arRenderOverlay();
          }
        }
      } catch { /* det is best-effort; a failed pass just skips this tick */ }
      arDetBusy = false;
    }
    if (arActive) arDetHandle = setTimeout(arDetTick, AR_DET_INTERVAL_MS);
  }

  function arTrackTick() {
    arTrackHandle = requestAnimationFrame(arTrackTick);
    if (!arActive || !cameraVideo.videoWidth) return;
    const rect = computeCaptureRect();
    if (!rect || !arKeyLuma) { arRenderOverlay(); return; }
    const curLuma = arGrabLuma(rect);
    const m = arEstimateMotion(arKeyLuma, curLuma);
    // Scale from downsampled tracking space back to video-pixel space.
    arMotion = { dx: m.dx * (rect.sw / AR_TRACK_W), dy: m.dy * (rect.sh / AR_TRACK_H) };
    arRenderOverlay();
  }

  // Turn a fresh analysis result into tracker state: run the SAME checkOrder
  // flag logic as ever, remap EVERY book's bbox (not just flagged ones) from
  // image-pixel space back into full video-frame pixel space using the
  // capture rect this cycle used, reset the tracker's reference frame + zero
  // the accumulated motion, and refresh the flagged-books sheet. Every
  // detected book gets a box now — red for misshelved, grey for "couldn't
  // confirm", green for confidently correct — so the overlay reads like a
  // live labeling pass over the whole shelf rather than only surfacing
  // problems. Numbering (for the tap-to-list correlation) stays reserved for
  // flagged books, same as the sheet below, so a dense shelf of green boxes
  // doesn't turn into a wall of badges.
  function arApplyResults(books, section, rect) {
    const checked = checkOrder(books, section);
    lastCheckedBooks = checked;
    const sentW = lastApiDims.sentW, sentH = lastApiDims.sentH;
    const toVideoX = sc => rect.sx + sc * (rect.sw / sentW);
    const toVideoY = sc => rect.sy + sc * (rect.sh / sentH);
    // "box N" in the flagged-list rows (showFlaggedList) is each book's 1-based
    // position among ALL books on the shelf, not a flagged-only count — match
    // that here so a box's badge number is the same number its list row shows.
    arLastBoxes = checked.filter(b => b._bbox)
      .map((b) => {
        const [bx, by, bw, bh] = b._bbox;
        const flagged = b.outOfOrder || b.unverifiable || b.possiblyOutOfOrder;
        return {
          bbox: [toVideoX(bx), toVideoY(by), bw * (rect.sw / sentW), bh * (rect.sh / sentH)],
          book: b,
          color: b.outOfOrder ? '#ef4444' : (b.unverifiable || b.possiblyOutOfOrder) ? '#eab308' : '#22c55e',
          dashed: b._src === 'gemini-synth',
          flagged,
          index: flagged ? checked.indexOf(b) + 1 : null,
          _overlayRect: null,
        };
      });
    // Re-anchor the det-only boxes into the new reference frame (the read
    // cycle resets arKeyLuma to the current frame and zeroes the drift), so
    // grey boxes on not-yet-read stickers stay put instead of jumping.
    const _preDx = arMotion.dx, _preDy = arMotion.dy;
    arKeyLuma = arGrabLuma(rect);
    arMotion  = { dx: 0, dy: 0 };
    if (arDetBoxes.length) arDetBoxes = arDetBoxes.map(d =>
      ({ bbox: [d.bbox[0] + _preDx, d.bbox[1] + _preDy, d.bbox[2], d.bbox[3]] }));
    arRenderOverlay();

    const total = checked.length;
    (window.__shelfcheckRenders = window.__shelfcheckRenders || []).push({
      t: performance.now(), section, total,
      outCount: checked.filter(b => b.outOfOrder).length,
      unvCount: checked.filter(b => b.unverifiable).length,
      possiblyCount: checked.filter(b => b.possiblyOutOfOrder).length, ar: true,
      books: checked.map(b => ({
        spine_label: b.spine_label, title: b.title || null, title_verified: !!b.title_verified,
        outOfOrder: !!b.outOfOrder, unverifiable: !!b.unverifiable,
        possiblyOutOfOrder: !!b.possiblyOutOfOrder, shelfRow: b.shelfRow ?? null,
      })),
    });

    showFlaggedList(checked, arSheet);
  }

  // One full analysis cycle: grab the current framing, run the existing
  // encode/OCR/finishLabels/checkOrder pipeline completely unchanged, apply
  // the fresh boxes, then immediately schedule the next cycle. No fixed
  // timer — cadence is exactly however long the device's pipeline takes,
  // never overlapping, never queuing up stale work.
  async function arScanCycle() {
    const myToken = arLoopToken;
    if (!arActive) return;
    // rect stays in VIDEO-pixel space throughout — it's what arApplyResults
    // uses afterward to map analysis results back onto the live overlay, and
    // that mapping is resolution-agnostic (a ratio), so it's unaffected by
    // which source image (video frame vs a higher-res still) actually gets
    // analyzed below.
    const rect = computeCaptureRect();
    if (!rect) { setTimeout(() => { if (arLoopToken === myToken) arScanCycle(); }, 400); return; }

    // Prefer a real photographic still (ImageCapture) when available — much
    // higher resolution than the live preview stream, which matters because
    // the sticker text this app reads is tiny relative to the whole frame.
    // Rescale the video-space crop rect into the still's own pixel space
    // (same physical framing, just a different resolution) before cropping.
    const stillPhoto = await arGrabStillPhoto();
    if (arLoopToken !== myToken) return;   // camera closed mid-capture
    const source = stillPhoto || cameraVideo;
    const srcW = stillPhoto ? stillPhoto.width  : cameraVideo.videoWidth;
    const srcH = stillPhoto ? stillPhoto.height : cameraVideo.videoHeight;
    const rx = stillPhoto ? srcW / cameraVideo.videoWidth  : 1;
    const ry = stillPhoto ? srcH / cameraVideo.videoHeight : 1;
    const cropX = rect.sx * rx, cropY = rect.sy * ry, cropW = rect.sw * rx, cropH = rect.sh * ry;

    const sc = Math.min(1, MAX_CANVAS_DIM / Math.max(cropW, cropH));
    snapshot.width  = Math.round(cropW * sc);
    snapshot.height = Math.round(cropH * sc);
    snapshot.getContext('2d').drawImage(source, cropX, cropY, cropW, cropH, 0, 0, snapshot.width, snapshot.height);
    stillPhoto?.close?.();
    saveCleanPhoto();

    // Throttle the remote (ocr.space) engine during continuous AR so the free
    // tier's ~10-scans/day quota isn't burned in seconds: fire it at most once
    // per AR_REMOTE_MIN_INTERVAL_MS; every cycle in between reads on-device
    // only. Red misshelving flags still need fused confidence, so they refresh
    // roughly every 20s; grey/green/yellow reads keep updating every cycle.
    const allowRemote = (performance.now() - arLastRemoteAt) >= AR_REMOTE_MIN_INTERVAL_MS;
    if (allowRemote) { arLastRemoteAt = performance.now(); console.log('[ar] remote OCR attempt (throttle window open)'); }

    arScanBusy = true;   // the ORT session is now in use by this read cycle — det-only pauses
    // Keep the "online check unavailable" state visible even mid-scan so the
    // persistent status isn't clobbered by a bare "Scanning…" every cycle.
    camMessage.textContent = arRemoteDown
      ? 'Scanning… · online check unavailable — local reads only'
      : 'Scanning…';
    analysisCancelled = false;
    analysisAbort = new AbortController();

    // When the online service is unreachable, keep saying so (persistent status)
    // rather than reverting to the neutral "scanning" line and looking silent.
    const idleMsg = () => arRemoteDown
      ? 'Online check unavailable — local reads only'
      : 'Point at a shelf row — scanning automatically';
    const finishCycle = (delay, msg) => {
      analysisAbort = null;
      arScanBusy = false;
      if (arActive) camMessage.textContent = msg || idleMsg();
      if (arLoopToken === myToken && arActive) {
        if (delay) setTimeout(() => { if (arLoopToken === myToken) arScanCycle(); }, delay);
        else arScanCycle();
      }
    };

    // Only pay the remote-encode cost on cycles that are actually allowed to
    // call the remote engine; throttled cycles read on-device from `snapshot`.
    let encoded = null;
    if (allowRemote) {
      try { encoded = await encodeForOCR(); }
      catch { finishCycle(800, 'Reconnecting…'); return; }
      if (arLoopToken !== myToken) return;   // camera closed / loop restarted mid-cycle
    }

    let ocrData;
    try {
      ocrData = await runOcr(encoded, analysisAbort.signal, () => {}, { arMode: true, skipRemote: !allowRemote });
    } catch { finishCycle(800, 'Reconnecting…'); return; }
    if (arLoopToken !== myToken) return;

    lastRawBooks = labelsToBooks(ocrData.labels);
    lastApiDims  = { sentW: ocrData.imageSize[0], sentH: ocrData.imageSize[1] };
    const detected = autoDetectSection(lastRawBooks);
    if (detected) setActiveTab(detected);

    arApplyResults(lastRawBooks, getSection(), rect);

    if (ocrData.refine) {
      ocrData.refine.then(refined => {
        if (arLoopToken !== myToken || !refined) return;
        lastRawBooks = labelsToBooks(refined.labels);
        lastApiDims  = { sentW: refined.imageSize[0], sentH: refined.imageSize[1] };
        arApplyResults(lastRawBooks, getSection(), rect);
      });
    }

    finishCycle(0);
  }

  function startArLoop() {
    arActive = true;
    arLoopToken++;
    arLastBoxes = []; arKeyLuma = null; arMotion = { dx: 0, dy: 0 };
    arDetBoxes = []; arDetBusy = false; arScanBusy = false;
    // Seed one full interval in the past (performance.now() is ms-since-load,
    // so a literal 0 would wrongly gate the remote engine off for the first
    // 20s of the page's life) → the very first cycle is allowed to fuse.
    arRemoteDown = false; arLastRemoteAt = -AR_REMOTE_MIN_INTERVAL_MS;
    if (!arTrackHandle) arTrackHandle = requestAnimationFrame(arTrackTick);
    if (!arDetHandle) arDetHandle = setTimeout(arDetTick, 0);  // grey boxes ASAP, before the first full cycle
    arScanCycle();
  }

  function stopArLoop() {
    arActive = false;
    arLoopToken++;   // in-flight cycle's checks will now fail, so it stops rescheduling itself
    if (analysisAbort) { analysisCancelled = true; analysisAbort.abort(); analysisAbort = null; }
    if (arTrackHandle) { cancelAnimationFrame(arTrackHandle); arTrackHandle = null; }
    if (arDetHandle) { clearTimeout(arDetHandle); arDetHandle = null; }
    arLastBoxes = []; arKeyLuma = null; arImageCapture = null;
    arDetBoxes = []; arDetBusy = false; arScanBusy = false;
    const ctx = arLiveOverlay.getContext('2d');
    if (arLiveOverlay.width) ctx.clearRect(0, 0, arLiveOverlay.width, arLiveOverlay.height);
    arBoxPulse.classList.remove('show');
    arSheet.classList.remove('show'); arSheet.innerHTML = '';
    arCaptionEl?.classList.remove('show');
  }

  // Tap-to-highlight on the live overlay: hit-test against each box's last
  // rendered on-screen rect (arRenderOverlay keeps these current every frame)
  // rather than the classic canvas/sentW-sentH math, since the AR overlay's
  // mapping changes continuously with camera pan/zoom. Every box is tappable
  // now, not just flagged ones — flagged boxes open their flagged-list row
  // as before; green/grey boxes (no list row to open) pop a small caption
  // with what was read instead.
  arLiveOverlay.addEventListener('click', e => {
    if (!arActive) return;
    const rect = arLiveOverlay.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const tapX = (e.clientX - rect.left) * dpr;
    const tapY = (e.clientY - rect.top)  * dpr;
    const hit = arLastBoxes.find(en => en._overlayRect &&
      tapX >= en._overlayRect[0] && tapX <= en._overlayRect[0] + en._overlayRect[2] &&
      tapY >= en._overlayRect[1] && tapY <= en._overlayRect[1] + en._overlayRect[3]);
    if (hit && hit.flagged) {
      arHideCaption();
      highlightArrow(hit.book);
      openBookDetail(hit.book, arSheet);
    } else if (hit) {
      popBoxPulse(hit.book);
      arShowCaption(hit);
    } else {
      arBoxPulse.classList.remove('show');
      arHideCaption();
    }
  });

  // Pinch-to-zoom
  let pinchDist = 0, pinchZoom = 1;
  const touchDist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  cameraLive.addEventListener('touchstart', e => { if (e.touches.length === 2) { pinchDist = touchDist(e.touches); pinchZoom = camZoom; } }, { passive: false });
  cameraLive.addEventListener('touchmove',  e => { if (e.touches.length === 2 && pinchDist) { e.preventDefault(); setZoom(pinchZoom * touchDist(e.touches) / pinchDist); } }, { passive: false });

  camClose.addEventListener('click', closeLiveCamera);
  uploadPicBtn.addEventListener('click', () => uploadInput.click());
  retakeBtn.addEventListener('click', retake);
  photoInput.addEventListener('change',  () => { if (photoInput.files[0])  loadPhoto(photoInput.files[0]); });
  uploadInput.addEventListener('change', () => { if (uploadInput.files[0]) loadPhoto(uploadInput.files[0]); });

  // ── Image encoding ────────────────────────────────────────────────────────
  // Step-halving downscale avoids bilinear smearing on large reductions.
  function stepDownscale(srcCanvas, tW, tH) {
    let cur = srcCanvas, cw = cur.width, ch = cur.height;
    while (cw / tW > 2 || ch / tH > 2) {
      const nw = Math.max(tW, Math.ceil(cw / 2)), nh = Math.max(tH, Math.ceil(ch / 2));
      const step = document.createElement('canvas');
      step.width = nw; step.height = nh;
      step.getContext('2d').drawImage(cur, 0, 0, nw, nh);
      cur = step; cw = nw; ch = nh;
    }
    if (cw !== tW || ch !== tH) {
      const fin = document.createElement('canvas');
      fin.width = tW; fin.height = tH;
      fin.getContext('2d').drawImage(cur, 0, 0, tW, tH);
      return fin;
    }
    return cur;
  }

  // Returns Promise<{blob, sentW, sentH, canvas}>
  // sentW/sentH are the pixel dims of the sent image — used to map OCR bbox coords.
  // canvas is kept so the OCR pipeline can sample pixels and create the rotated image.
  function encodeForOCR(maxDim = 2400, quality = 0.88) {
    const t0 = performance.now();
    const W = snapshot.width, H = snapshot.height;
    const scale = Math.min(1, maxDim / Math.max(W, H));
    const sentW = Math.round(W * scale), sentH = Math.round(H * scale);
    const resized = stepDownscale(snapshot, sentW, sentH);
    const out = document.createElement('canvas');
    out.width = sentW; out.height = sentH;
    const ctx = out.getContext('2d');
    ctx.filter = 'contrast(1.08) saturate(1.05)';
    ctx.drawImage(resized, 0, 0);
    return new Promise((resolve, reject) => {
      out.toBlob(blob => {
        console.log(`[perf] encodeForOCR: ${Math.round(performance.now() - t0)}ms (${sentW}x${sentH}, ${blob ? (blob.size/1024).toFixed(0)+'KB' : 'failed'})`);
        if (!blob) { reject(new Error('image encoding failed')); return; }
        resolve({ blob, sentW, sentH, canvas: out });
      }, 'image/jpeg', quality);
    });
  }

  // ── OCR pipeline (ocr.space via Cloudflare Worker) ───────────────────────

  // Low-level proxy call: POST raw JPEG blob, returns ocr.space JSON.
  async function callOcrProxy(blob, externalSignal) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), OCR_TIMEOUT_MS);
    const onAbort = () => ctrl.abort();
    if (externalSignal) {
      if (externalSignal.aborted) { ctrl.abort(); }
      else externalSignal.addEventListener('abort', onAbort, { once: true });
    }
    let res;
    try {
      res = await fetch(WORKER_URL, {
        method: 'POST', body: blob,
        headers: { 'Content-Type': 'image/jpeg' },
        signal: ctrl.signal,
      });
    } finally {
      clearTimeout(timer);
      if (externalSignal) externalSignal.removeEventListener('abort', onAbort);
    }
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      const err = new Error(`Worker ${res.status}: ${t.slice(0, 200)}`);
      err.status = res.status;
      throw err;
    }
    const data = await res.json();
    if (data.IsErroredOnProcessing) throw new Error(`ocr.space: ${data.ErrorMessage}`);
    return data;
  }

  // ── Local OCR wrapper ────────────────────────────────────────────────────
  // Runs the in-browser engine (ocr_local.js) on the full-res snapshot and
  // adapts its output to the boxed-book shape the fusion pipeline expects
  // (the same shape the old Gemini tile path produced): spine_label +
  // bboxFrac fractions of the source canvas, projected into whatever pixel
  // space the render target uses by mapGemToPixels.
  // Keep only labels that look like call-number stickers — the same rule the
  // OCR reconstruction applies (nonfiction needs a Dewey number; fiction needs
  // an uppercase surname-ish first token). White book spines otherwise leak
  // publisher/title text into the results and poison the ordering check.
  function localLabelPlausible(text, section) {
    if (section === 'nonfiction') return /\d{3}/.test(text);
    const t0 = String(text).trim().split(/\s+/)[0] || '';
    const letters = t0.replace(/[^A-Za-z]/g, '');
    if (letters.length < 3) return false;
    return letters.replace(/[^A-Z]/g, '').length / letters.length >= 0.6;
  }

  // Clean up raw rec text: OCR confuses commas/spaced dots inside Dewey
  // numbers, and a malformed number both mis-sorts and blocks cross-engine
  // confirmation.
  function normalizeLocalText(t, section) {
    let s = String(t).replace(/\s+/g, ' ').trim();
    if (section === 'nonfiction') {
      s = s.replace(/(\d)\s*,\s*(\d)/g, '$1.$2');   // 635,048  -> 635.048
      s = s.replace(/(\d)\.\s+(\d)/g, '$1.$2');      // 635. 048 -> 635.048
      s = s.replace(/^(\d+)\.(?!\d)/, '$1');         // 635. XYZ -> 635 XYZ
    }
    return s;
  }

  async function callLocalOcr(src, signal) {
    const t0 = performance.now();
    const section = getSection();
    // note: plausibility runs on the RAW text; normalization happens below in
    // the book mapping so truncation evidence (trailing "635.") survives
    // until the confidence decision.
    const labels = (await LocalOCR.run(src, { signal }))
      .filter(l => localLabelPlausible(l.text, section));
    // 'high' is deliberately strict (0.97): raw OCR misreads ("NALKER" for
    // WALKER) usually dip below it, and only high-confidence books are ever
    // eligible for misshelving flags — a wrong flag is worse than a grey
    // "unverifiable" entry. A Dewey number ending in a bare separator
    // ("635." / "635,0") is a truncated read — same demotion.
    const truncatedNum = t => section === 'nonfiction' &&
      (/^\s*\d{1,3}[.,](?!\d)/.test(t) || /^\s*\d{1,3}\.\d*0(?=\s|$)/.test(t));
    const books = labels.map(l => ({
      spine_label: normalizeLocalText(l.text, section),
      title: null,
      confidence: (l.conf >= 0.97 && !truncatedNum(l.text)) ? 'high' : 'low',
      shelfRow: 0,
      bboxFrac: l.bboxFrac,
    }));
    console.log(`[perf] callLocalOcr: ${books.length} book(s) at ${Math.round(performance.now() - t0)}ms`);
    return books;
  }

  // Project fraction-space gem boxes into a target pixel space (the same
  // space the OCR labels' bboxes live in, so fusion can compare geometry).
  function mapGemToPixels(gemBooks, imgW, imgH) {
    return (gemBooks || []).map(b => b.bboxFrac
      ? { ...b, bbox: [b.bboxFrac[0] * imgW, b.bboxFrac[1] * imgH, b.bboxFrac[2] * imgW, b.bboxFrac[3] * imgH] }
      : { ...b });
  }

  // Extract text lines with bboxes from ocr.space TextOverlay.
  function parseOcrOverlay(data) {
    const lines = [];
    for (const parsed of (data.ParsedResults || [])) {
      for (const line of (parsed.TextOverlay?.Lines || [])) {
        const words = line.Words || [];
        if (!words.length) continue;
        const text = words.map(w => w.WordText || '').join(' ').trim();
        if (!text) continue;
        const lefts   = words.map(w => w.Left);
        const tops    = words.map(w => w.Top);
        const rights  = words.map(w => w.Left + w.Width);
        const bottoms = words.map(w => w.Top + w.Height);
        const x = Math.min(...lefts), y = Math.min(...tops);
        const w = Math.max(...rights) - x, h = Math.max(...bottoms) - y;
        lines.push({ text, bbox: [x, y, w, h], score: 0.9 });
      }
    }
    return lines;
  }

  // Fraction of pixels in a region whose luminance is >= thresh (0..1).
  function lightRatio(ctx, x, y, w, h, thresh = 150) {
    const cw = ctx.canvas.width, ch = ctx.canvas.height;
    x = Math.max(0, Math.round(x)); y = Math.max(0, Math.round(y));
    w = Math.min(cw - x, Math.max(1, Math.round(w)));
    h = Math.min(ch - y, Math.max(1, Math.round(h)));
    if (w <= 0 || h <= 0) return 0;
    const px = ctx.getImageData(x, y, w, h).data;
    let light = 0;
    for (let i = 0; i < px.length; i += 4) {
      if (0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2] >= thresh) light++;
    }
    return light / (w * h);
  }

  // Sample canvas pixels to determine if a region has a predominantly white background.
  function hasWhiteBg(ctx, x, y, w, h, thresh = 150, ratio = 0.55) {
    return lightRatio(ctx, x, y, w, h, thresh) >= ratio;
  }

  // Extract individual words with bboxes from ocr.space TextOverlay.
  function parseOcrWords(data) {
    const words = [];
    for (const parsed of (data.ParsedResults || [])) {
      for (const line of (parsed.TextOverlay?.Lines || [])) {
        for (const w of (line.Words || [])) {
          const t = (w.WordText || '').trim();
          if (t) words.push({ t, x: w.Left, y: w.Top, w: w.Width, h: w.Height });
        }
      }
    }
    return words;
  }

  // ── Label reconstruction ──────────────────────────────────────────────────
  // Nonfiction spine stickers are vertical stacks of tiny horizontal words:
  //   635 / .04 / CAR  (number anchor, optional decimal, cutter).
  // Book-title words on spines are much larger, so sticker words are found by
  // size, then assembled by vertical adjacency + x-alignment with a number.
  const RX_NUM_FULL = /^\d{3}\.\d+$/;
  const RX_NUM3     = /^\d{3}$/;
  const RX_DEC      = /^[.,](\d+)$/;
  const RX_CUTTER   = /^[A-Za-z]{2,4}$/;

  function reconstructNonfiction(words, ctx) {
    const maxDim = Math.max(ctx.canvas.width, ctx.canvas.height);
    const maxH = maxDim * 0.022;                       // sticker text is tiny
    const small = words.filter(w => w.h <= maxH && w.w >= w.h * 0.6);
    const anchors = small.filter(w => RX_NUM_FULL.test(w.t) || RX_NUM3.test(w.t));

    const used = new Set();
    const labels = [];
    for (const a of anchors) {
      const axc = a.x + a.w / 2;
      let num = a.t;
      const parts = [a];
      let curBottom = a.y + a.h;

      // decimal continuation directly below a bare NNN anchor
      if (RX_NUM3.test(a.t)) {
        for (const w of small) {
          if (used.has(w) || w === a) continue;
          const m = RX_DEC.exec(w.t);
          if (!m) continue;
          const wxc = w.x + w.w / 2;
          if (Math.abs(wxc - axc) <= a.w * 1.2 && w.y - curBottom >= 0 && w.y - curBottom <= a.h * 2.5) {
            num = a.t + '.' + m[1];
            parts.push(w); used.add(w);
            curBottom = w.y + w.h;
            break;
          }
        }
      }

      // nearest cutter below the number
      let best = null;
      for (const w of small) {
        if (used.has(w) || w === a) continue;
        if (!RX_CUTTER.test(w.t)) continue;
        const wxc = w.x + w.w / 2;
        const dy = w.y - curBottom;
        if (Math.abs(wxc - axc) <= Math.max(a.w, w.w) * 1.2 && dy >= -a.h * 0.5 && dy <= a.h * 3.0) {
          if (!best || dy < best.dy) best = { dy, w };
        }
      }
      let cutter = null;
      if (best) { cutter = best.w.t.toUpperCase(); parts.push(best.w); used.add(best.w); }

      // sticker union box must sit on a light background
      const ux = Math.min(...parts.map(p => p.x)),  uy = Math.min(...parts.map(p => p.y));
      const ur = Math.max(...parts.map(p => p.x + p.w)), ub = Math.max(...parts.map(p => p.y + p.h));
      if (lightRatio(ctx, ux - 4, uy - 4, (ur - ux) + 8, (ub - uy) + 8) < 0.30) continue;

      labels.push({ text: num + (cutter ? ' ' + cutter : ''), num, cut: cutter,
                    bbox: [ux, uy, ur - ux, ub - uy], score: 0.9 });
    }

    // Consensus repair: books shelved together share a class number, and OCR
    // truncates the decimal on some stickers.  Upgrade number X to the most
    // common LONGER number Y that X is a prefix of, but only when Y was read
    // in full at least twice AND more often than X (so one misread can't
    // corrupt the shelf).
    const counts = new Map();
    for (const l of labels) counts.set(l.num, (counts.get(l.num) || 0) + 1);
    for (const l of labels) {
      const n = l.num;
      let best = null;
      for (const [y, c] of counts) {
        if (y === n || !y.startsWith(n) || y.length <= n.length) continue;
        if (c < 2 || c <= counts.get(n)) continue;
        if (!best || c > best.c || (c === best.c && y.length > best.y.length)) best = { c, y };
      }
      if (best) {
        l.num = best.y;
        l.text = best.y + (l.cut ? ' ' + l.cut : '');
      }
    }

    // Bare numbers without a cutter can't be ordered — drop as noise.
    return labels.filter(l => l.cut);
  }

  // Fiction stickers are 2–3 stacked short lines: SURNAME / First (or VON /
  // SURNAME / First).  Cluster sticker-like lines by x-overlap + vertical
  // adjacency, join top-to-bottom.
  function reconstructFiction(lines, ctx) {
    const maxDim = Math.max(ctx.canvas.width, ctx.canvas.height);
    const maxH = maxDim * 0.025;
    const cand = lines.filter(ln => {
      const [x, y, w, h] = ln.bbox;
      if (h > maxH || w < h * 0.75) return false;
      return lightRatio(ctx, x - 4, y - 4, w + 8, h + 8) >= 0.35;
    });

    const n = cand.length;
    const parent = Array.from({ length: n }, (_, i) => i);
    const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    const union = (i, j) => { const ri = find(i), rj = find(j); if (ri !== rj) parent[rj] = ri; };

    const xOverlap = (a, b) => {
      const [ax,, aw] = a.bbox, [bx,, bw] = b.bbox;
      const ov = Math.min(ax + aw, bx + bw) - Math.max(ax, bx);
      return ov / Math.max(1, Math.min(aw, bw));
    };
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        if (xOverlap(cand[i], cand[j]) < 0.4) continue;
        const [, ay,, ah] = cand[i].bbox, [, by,, bh] = cand[j].bbox;
        const gap = Math.max(ay, by) - Math.min(ay + ah, by + bh);
        if (gap <= Math.max(ah, bh) * 1.2) union(i, j);
      }
    }

    const groups = new Map();
    for (let i = 0; i < n; i++) {
      const r = find(i);
      if (!groups.has(r)) groups.set(r, []);
      groups.get(r).push(cand[i]);
    }

    const out = [];
    for (const g of groups.values()) {
      g.sort((a, b) => a.bbox[1] - b.bbox[1]);
      const text = g.map(l => l.text).join(' ');
      const first = (text.trim().split(/[\s,.]+/)[0] || '');
      const alpha = first.replace(/[^A-Za-z]/g, '');
      if (alpha.length < 3) continue;
      let upp = 0;
      for (const c of alpha) if (c >= 'A' && c <= 'Z') upp++;
      if (upp / alpha.length < 0.6) continue;
      const ux = Math.min(...g.map(l => l.bbox[0]));
      const uy = Math.min(...g.map(l => l.bbox[1]));
      const ur = Math.max(...g.map(l => l.bbox[0] + l.bbox[2]));
      const ub = Math.max(...g.map(l => l.bbox[1] + l.bbox[3]));
      out.push({ text, bbox: [ux, uy, ur - ux, ub - uy], score: 0.9 });
    }
    return out;
  }

  // retained: parity-test extraction anchor (also no longer called directly —
  // titles now come from Gemini — but the comment below is parity_check.mjs's
  // end-of-slice marker, so both stay byte-identical).
  // Map a bbox from the 90°-CW rotated image back to original image coordinates.
  function mapBackRotated(rx, ry, rw, rh, origH) {
    return [ry, Math.max(0, origH - rx - rw), rh, rw];
  }

  // ── Gemini fusion (pure; extracted by fusion_test.mjs) ──────────────────────
  // Fuses Gemini's superior text reads onto ocr.space's precise word boxes.
  // Any disagreement or Gemini-only find is demoted to score 0.6 (< the 0.65
  // "high confidence" threshold in labelsToBooks), so a fusion mistake can only
  // ever produce a yellow "check this" box, never a false red misshelving flag.

  function fuseNorm(s) {
    return String(s || '').toUpperCase().replace(/[^A-Z0-9. ]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function fuseEditDist(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        dp[i][j] = a[i - 1] === b[j - 1]
          ? dp[i - 1][j - 1]
          : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
      }
    }
    return dp[m][n];
  }

  function fuseParse(t) {
    const numM = /\d{1,3}(?:\.\d+)?/.exec(t);
    const num = numM ? numM[0] : null;
    let cut = null;
    if (num) {
      const after = t.slice(numM.index + numM[0].length);
      const cutM = /[A-Z]{2,}/.exec(after);
      cut = cutM ? cutM[0] : null;
    }
    const surM = /[A-Z]{2,}/.exec(t);
    const sur = surM ? surM[0] : null;
    return { num, cut, sur };
  }

  function fuseSim(a, b) {
    const A = fuseNorm(a), B = fuseNorm(b);
    if (!A || !B) return 0;
    if (A === B) return 1;
    const pa = fuseParse(A), pb = fuseParse(B);
    if (pa.num && pb.num) {
      // Number-only agreement must NOT alone clear MATCH_MIN (0.5): a whole
      // nonfiction shelf row shares one Dewey number, so a bare-number base
      // score that already crosses the threshold makes the aligner blind to
      // cutters and lets it pair unrelated same-number books. Cutter
      // agreement (exact or 1-edit typo) is required to push the pair over.
      let s = 0;
      if (pa.num === pb.num || pa.num.startsWith(pb.num) || pb.num.startsWith(pa.num)) s = 0.3;
      else if (fuseEditDist(pa.num, pb.num) <= 1) s = 0.15;
      else return 0;
      if (pa.cut && pb.cut) {
        if (pa.cut === pb.cut) s += 0.4;
        else if (fuseEditDist(pa.cut, pb.cut) <= 1) s += 0.25;
      }
      return Math.min(1, s);
    }
    if (!pa.num && !pb.num) {
      if (pa.sur && pa.sur === pb.sur) return 0.9;
      if (pa.sur && pb.sur && fuseEditDist(pa.sur, pb.sur) <= 1) return 0.7;
      if (pa.sur && pb.sur && pa.sur.length >= 5 && pb.sur.length >= 5 && fuseEditDist(pa.sur, pb.sur) <= 2) return 0.5;
      return 0;
    }
    return 0;
  }

  // Needleman-Wunsch global alignment of two ordered sequences of texts.
  function fuseAlignRow(oTexts, gTexts) {
    const n = oTexts.length, m = gTexts.length;
    const GAP = -0.05, MATCH_MIN = 0.5;
    const S = Array.from({ length: n + 1 }, () => new Float64Array(m + 1));
    for (let i = 1; i <= n; i++) S[i][0] = i * GAP;
    for (let j = 1; j <= m; j++) S[0][j] = j * GAP;
    const simCache = Array.from({ length: n }, () => new Float64Array(m));
    for (let i = 0; i < n; i++) for (let j = 0; j < m; j++) simCache[i][j] = fuseSim(oTexts[i], gTexts[j]);
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= m; j++) {
        const sim = simCache[i - 1][j - 1];
        const diag = sim >= MATCH_MIN ? S[i - 1][j - 1] + sim : -Infinity;
        S[i][j] = Math.max(diag, S[i - 1][j] + GAP, S[i][j - 1] + GAP);
      }
    }
    const pairs = [], oOnly = [], gOnly = [];
    let i = n, j = m;
    while (i > 0 || j > 0) {
      const sim = (i > 0 && j > 0) ? simCache[i - 1][j - 1] : -1;
      const diag = (i > 0 && j > 0 && sim >= MATCH_MIN) ? S[i - 1][j - 1] + sim : -Infinity;
      if (i > 0 && j > 0 && S[i][j] === diag) {
        pairs.push([i - 1, j - 1]); i--; j--;
      } else if (i > 0 && S[i][j] === S[i - 1][j] + GAP) {
        oOnly.push(i - 1); i--;
      } else {
        gOnly.push(j - 1); j--;
      }
    }
    pairs.reverse(); oOnly.reverse(); gOnly.reverse();

    // Rescue pass: the DP above is a single monotonic sequence alignment, so
    // one local disruption (duplicate/near-duplicate candidates, a box one
    // engine split or merged differently) can knock an otherwise-perfect
    // match out of position for the rest of the row — leaving a book that
    // BOTH engines actually read identically stranded in oOnly/gOnly, where
    // it's unconditionally scored as unconfirmed (0.6) even though real
    // cross-engine agreement exists. Sweep the leftovers for the strongest
    // remaining exact-text matches and promote them into pairs; this can only
