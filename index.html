    const checked = books.map((book, i) => {
      const pos = i + 1;
      if (!keys[i]) return { ...book, outOfOrder: false, unverifiable: true, possiblyOutOfOrder: false, idealPosition: null, shelfPosition: pos, shelfSize: books.length, tiedGroupSlots: null };
      const ideal    = idealRank.get(i) ?? null;
      const tied     = tiedSlots.get(i) || null;
      const inTied   = tied && pos >= tied[0] && pos <= tied[1];
      return { ...book, outOfOrder: !lisGlobal.has(i) && !inTied, unverifiable: false, possiblyOutOfOrder: false, idealPosition: ideal, shelfPosition: pos, shelfSize: books.length, tiedGroupSlots: tied };
    });

    // Post-pass: sandwich / near-twin demotion
    for (let i = 0; i < checked.length; i++) {
      if (!checked[i].outOfOrder) continue;
      // Skip past null-key (unverifiable) neighbors too, not just flagged
      // ones — a truncated OCR read (VONNE next to VONNEGUT) often sits
      // beside an unparseable read, and stopping there let the near-twin
      // demotion below miss obvious truncation artifacts.
      let L = i - 1; while (L >= 0 && (checked[L].outOfOrder || !keys[L])) L--;
      let R = i + 1; while (R < checked.length && (checked[R].outOfOrder || !keys[R])) R++;
      if (L < 0 || R >= checked.length) continue;
      const kL = keys[L], kR = keys[R], kM = keys[i];
      if (!kL || !kR || !kM) continue;
      // This whole post-pass exists to rescue a SINGLE-engine misread that
      // looks sandwiched between two identical/near-identical real reads
      // (e.g. a garbled duplicate-detection artifact). A book with its OWN
      // independent cross-engine confirmation (score >= 0.9, src 'both')
      // doesn't need rescuing from that same-key-neighbors heuristic — two
      // engines agreeing on ITS text is stronger evidence than "its
      // neighbors happen to share a key", so demoting it anyway just
      // because duplicate copies of the same call number legitimately sit
      // on the shelf was needlessly turning good reads into "please check".
      const crossConfirmed = checked[i]._score >= 0.9 && checked[i]._src === 'both';
      let demote = !crossConfirmed && compareKeys(kL, kR) === 0;
      if (!demote && kL.kind === kR.kind && kM.kind === kL.kind) {
        const vL = kL.kind === 'str' ? kL.val : String(kL.val.num ?? '');
        const vR = kR.kind === 'str' ? kR.val : String(kR.val.num ?? '');
        const vM = kM.kind === 'str' ? kM.val : String(kM.val.num ?? '');
        if (vL && vR && vM && vL[0] === vR[0] &&
            Math.abs(vM.charCodeAt(0) - vL.charCodeAt(0)) >= 3 &&
            Math.abs(vM.charCodeAt(0) - vR.charCodeAt(0)) >= 3) demote = true;
      }
      if (!demote && kM.kind === 'str') {
        const vM = kM.val || '';
        for (const kN of [kL, kR]) {
          if (kN.kind !== 'str') continue;
          const vN = kN.val || '';
          const minLen = Math.min(vM.length, vN.length);
          if (vM !== vN && ((minLen >= 5 && editDistance(vM, vN) <= 2) ||
                            (minLen >= 4 && editDistance(vM, vN) <= 1))) { demote = true; break; }
        }
      }
      // Dewey cutter near-twin: same call number as both neighbors and a
      // cutter one edit away from a neighbor's is a misread of that neighbor's
      // sticker ("635 FRA" beside "635 FRO"), not a misshelved book.
      if (!demote && kM.kind !== 'str' && kL.kind === kM.kind && kR.kind === kM.kind &&
          kM.val.num != null && kM.val.num === kL.val.num && kM.val.num === kR.val.num) {
        const cM = kM.val.cut || '';
        for (const kN of [kL, kR]) {
          const cN = kN.val.cut || '';
          if (cM && cN && cM !== cN && editDistance(cM, cN) <= 1) { demote = true; break; }
        }
      }
      if (demote) { checked[i].outOfOrder = false; checked[i].unverifiable = true; checked[i].idealPosition = null; }
    }

    // ── Unverified-title order pass → possiblyOutOfOrder (yellow) ────────────
    // Within a primary-key tie group, unverified spine-read titles are blanked
    // by sortKey (never feed the red LIS), so two clearly out-of-alphabetical-
    // order titles on tied books go unsurfaced. Surface that as YELLOW
    // ("possibly out of order — not sure"), NEVER red: a title that is not
    // OL-verified is single-source evidence and must never cause outOfOrder
    // (the 0-false-positive misshelving invariant). Verified titles already
    // break the primary key and get red via the LIS above, so they are
    // excluded here.
    //
    // Noise guard: only a FIRST-LETTER disagreement counts as a violation.
    // Sub-first-letter OCR noise (a stray middle character) must not trigger a
    // flag, so titles sharing a first letter are treated as tied for ordering.
    const filingTitle = t =>
      lettersLower(String(t || '').replace(/^the\s+|^a\s+|^an\s+/i, ''));
    const titleCmp = (a, b) => (a[0] === b[0] ? 0 : compareFiling(a, b));
    const titleLNDS = titles => {
      const n = titles.length;
      if (!n) return new Set();
      const dp = new Array(n).fill(1), prev = new Array(n).fill(-1);
      let bestEnd = 0;
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < i; j++) {
          if (titleCmp(titles[j], titles[i]) <= 0 && dp[j] + 1 > dp[i]) { dp[i] = dp[j] + 1; prev[i] = j; }
        }
        if (dp[i] > dp[bestEnd]) bestEnd = i;
      }
      const set = new Set();
      for (let i = bestEnd; i !== -1; i = prev[i]) set.add(i);
      return set;
    };

    // Group verified indices by their tie range (lo is unique per group, since
    // vIdx is strictly increasing). Books in the same tie group share [lo, hi].
    const titleGroups = new Map();
    for (let i = 0; i < checked.length; i++) {
      const tied = tiedSlots.get(i);
      if (!tied) continue;
      const gk = tied[0];
      if (!titleGroups.has(gk)) titleGroups.set(gk, []);
      titleGroups.get(gk).push(i);   // pushed in physical (left→right) order
    }
    for (const members of titleGroups.values()) {
      if (members.length < 2) continue;   // singletons are never "out of order"
      const eligIdx = [], eligTitle = [];
      for (const i of members) {
        const b = checked[i];
        if (b.outOfOrder || b.unverifiable) continue;   // already surfaced otherwise
        if (b.title_verified) continue;                 // verified titles → red path, handled by LIS
        const ft = filingTitle(b.title);
        if (!ft) continue;                              // empty/absent title
        if ((b.title || '').replace(/[^a-z0-9]/gi, '').length < 4) continue;  // min length bar
        if (!(typeof b.title_conf === 'number' && b.title_conf >= 0.6)) continue;  // confidence bar
        eligIdx.push(i); eligTitle.push(ft);
      }
      if (eligIdx.length < 2) continue;
      const keep = titleLNDS(eligTitle);   // longest non-decreasing (by first letter) run
      eligTitle.forEach((_, k) => {
        if (!keep.has(k)) checked[eligIdx[k]].possiblyOutOfOrder = true;
      });
    }

    return checked;
  }

  function checkOrder(books, section) {
    const shelves = groupByShelfRow(books);
    const checked = shelves.flatMap((shelf, si) =>
      checkOrderOneShelf(shelf, section).map(b => ({ ...b, shelfIndex: si }))
    );
    // Stray-duplicate demotion: a flagged label whose exact text also sits
    // IN order in a different row is almost always the same sticker detected
    // twice (tile overlap / row mis-clustering), not a second misshelved
    // copy — don't accuse on a phantom.
    const dupNorm = t => (t || '').toUpperCase().replace(/\s+/g, ' ').trim();
    for (const b of checked) {
      if (!b.outOfOrder) continue;
      const n = dupNorm(b.spine_label);
      if (n && checked.some(o => o !== b && !o.outOfOrder && !o.unverifiable &&
                                 o.shelfRow !== b.shelfRow && dupNorm(o.spine_label) === n)) {
        b.outOfOrder = false; b.unverifiable = true; b.idealPosition = null;
      }
    }
    return checked;
  }

  // ── Results display ───────────────────────────────────────────────────────
  // Returns 'nonfiction', 'fiction', or null if ambiguous / too few labels.
  function autoDetectSection(books) {
    const labels = books.map(b => b.spine_label).filter(Boolean);
    if (labels.length < 3) return null;
    const deweyish = labels.filter(l => /^\s*\d{1,3}(\.\d+)?(\s|$)/.test(String(l))).length;
    const ratio = deweyish / labels.length;
    if (ratio > 0.6)  return 'nonfiction';
    if (ratio < 0.15) return 'fiction';
    return null;
  }

  function setActiveTab(section) {
    document.querySelectorAll('.tab-btn').forEach(b => {
      const active = b.dataset.section === section;
      b.classList.toggle('active', active);
      b.setAttribute('aria-selected', String(active));
    });
    try { localStorage.setItem('shelfcheck.section', section); } catch {}
  }

  // Classic still-photo results view (snapshot + flaggedList). The live AR
  // loop has its own rendering path — arApplyResults + arRenderOverlay —
  // since its boxes track a still-playing video instead of a static photo.
  function showResults(books, section) {
    const checked = checkOrder(books, section);
    lastCheckedBooks = checked;

    document.getElementById('resultsOverlay')?.remove();
    actionBar.classList.remove('show');
    restoreCleanPhoto();   // redraw the clean photo before overlaying boxes

    const panel = document.getElementById('flaggedList');
    if (lastApiDims) drawBoundingBoxes(checked, lastApiDims.sentW, lastApiDims.sentH, snapshot);

    const total        = checked.length;
    const outCount     = checked.filter(b => b.outOfOrder).length;
    const unvCount     = checked.filter(b => b.unverifiable).length;
    const possiblyCount = checked.filter(b => b.possiblyOutOfOrder).length;

    // Test hook (harmless in prod): record each render's result + timestamp so
    // the e2e harness (e2e_pipeline_test.mjs) can read the real pipeline output
    // and measure first-vs-final (refine) render latency. Never read by the app.
    (window.__shelfcheckRenders = window.__shelfcheckRenders || []).push({
      t: performance.now(), section, total, outCount, unvCount, possiblyCount, ar: false,
      books: checked.map(b => ({
        spine_label:        b.spine_label,
        title:              b.title || null,
        title_verified:     !!b.title_verified,
        outOfOrder:         !!b.outOfOrder,
        unverifiable:       !!b.unverifiable,
        possiblyOutOfOrder: !!b.possiblyOutOfOrder,
        shelfRow:           b.shelfRow ?? null,
      })),
    });

    if (total === 0) {
      showNoBooksBadge();
      showFlaggedList([], panel);
      return;
    }

    // "possibly out of order" is a soft, unsure state — fold it into the same
    // "to check" bucket as unverifiable labels for the summary count.
    showSummaryBadge(total, outCount, unvCount + possiblyCount);
    showFlaggedList(checked, panel);
  }

  function showNoBooksBadge() {
    const overlay = document.createElement('div');
    overlay.id = 'resultsOverlay'; overlay.className = 'results-overlay';
    overlay.innerHTML = `<div class="overlay-badge badge-warn">No labels detected — retake</div>
      <button class="btn-new-scan" onclick="newScan()">Retake</button>`;
    photoArea.appendChild(overlay);
  }

  function showSummaryBadge(total, outCount, unvCount) {
    let cls, text;
    if (outCount > 0)      { cls = 'badge-warn';         text = `${outCount} out of order${unvCount ? ` · ${unvCount} to check` : ''} · ${total} read`; }
    else if (unvCount > 0) { cls = 'badge-unverifiable'; text = `${unvCount} to check · ${total} read`; }
    else                   { cls = 'badge-ok';           text = `✓ Shelf looks correct — ${total} book${total === 1 ? '' : 's'} read, none out of order`; }
    const overlay = document.createElement('div');
    overlay.id = 'resultsOverlay'; overlay.className = 'results-overlay';
    overlay.innerHTML = `<div class="overlay-badge ${cls}">${text}</div>
      <button class="btn-new-scan" onclick="newScan()">New Scan</button>`;
    photoArea.appendChild(overlay);
  }

  function showFlaggedList(checked, panel = document.getElementById('flaggedList')) {
    const flagged = checked.filter(b => b.outOfOrder || b.unverifiable || b.possiblyOutOfOrder);
    panel.innerHTML = '';
    _flaggedRowMap.clear();
    if (!flagged.length) {
      // Distinct success state: books were read and none needed flagging —
      // don't just leave the panel looking empty/broken.
      if (checked.length > 0) {
        const success = document.createElement('div');
        success.className = 'flagged-list-success';
        success.setAttribute('role', 'status');
        success.innerHTML = `<span class="flagged-list-success-icon" aria-hidden="true">&#10003;</span>
          <span>Shelf looks correct — ${checked.length} book${checked.length === 1 ? '' : 's'} read, none out of order.</span>`;
        panel.appendChild(success);
        panel.classList.add('show');
      } else {
        panel.classList.remove('show');
      }
      return;
    }

    const multiShelf = new Set(checked.map(b => b.shelfIndex).filter(i => i >= 0)).size > 1;
    const header = document.createElement('div');
    header.className = 'flagged-list-header';
    header.textContent = `Flagged books (${flagged.length})`;
    panel.appendChild(header);

    // Build a global index map: book → arrow number (1-based position in checked array)
    const globalIdx = new Map(checked.map((b, i) => [b, i + 1]));

    for (const book of flagged) {
      const isBad = book.outOfOrder;
      const row = document.createElement('div');
      row.className = 'flagged-item';
      row.setAttribute('role', 'button');
      row.setAttribute('tabindex', '0');
      row.setAttribute('aria-expanded', 'false');
      row.setAttribute('aria-label', `${book.spine_label || 'Book'}${book.title ? `, ${book.title}` : ''} — ${isBad ? 'out of order' : book.possiblyOutOfOrder ? 'possibly out of order' : 'check manually'}`);
      _flaggedRowMap.set(book, row);

      const posBits = [];
      if (multiShelf && book.shelfIndex >= 0) posBits.push(`shelf ${book.shelfIndex + 1}`);
      if (book.shelfPosition) posBits.push(`#${book.shelfPosition} of ${book.shelfSize}`);
      posBits.push(`box ${globalIdx.get(book) ?? '?'}`);

      const titleLine = book.title ? `<div class="flagged-item-title">${escapeHtml(book.title)}</div>` : '';
      row.innerHTML = `
        <div class="flagged-item-dot ${isBad ? 'flagged-item-dot-bad' : 'flagged-item-dot-unv'}"></div>
        <div class="flagged-item-text">
          <div class="flagged-item-label">${escapeHtml(book.spine_label) || '—'}</div>
          ${titleLine}
          <div class="flagged-item-sub">${escapeHtml(posBits.join(' · '))}</div>
        </div>
        <div class="flagged-item-status ${isBad ? 'flagged-item-status-bad' : 'flagged-item-status-unv'}">${isBad ? 'Out of order' : book.possiblyOutOfOrder ? 'Check order' : 'Check'}</div>`;

      // Build inline expandable detail (shown below row on tap)
      const detail = document.createElement('div');
      detail.className = 'flagged-item-detail';
      const dcolor = book.outOfOrder ? '#ef4444' : '#eab308';
      const dstatus = book.outOfOrder ? 'Out of order'
                    : book.possiblyOutOfOrder ? 'Possibly out of order — check title order'
                    : 'Check manually';
      detail.innerHTML = `
        ${book.title ? `<div class="fi-drow"><span class="fi-dk">Title</span><span class="fi-dv">${escapeHtml(book.title)}${book.title_verified ? ' <span style="opacity:.5;font-size:10px">✓</span>' : ''}</span></div>` : ''}
        <div class="fi-drow"><span class="fi-dk">Confidence</span><span class="fi-dv">${Math.round((book._score || 0) * 100)}%${book._title_score ? ` · title ${Math.round(book._title_score * 100)}%` : ''}</span></div>
        <div class="fi-drow"><span class="fi-dk">Position</span><span class="fi-dv">#${book.shelfPosition} of ${book.shelfSize} on shelf ${(book.shelfIndex ?? 0) + 1}</span></div>
        ${book.outOfOrder ? `<div class="fi-drow"><span class="fi-dk">Should be</span><span class="fi-dv">slot ${book.idealPosition ?? '?'}</span></div>` : ''}
        <div class="fi-dstatus" style="color:${dcolor}">${dstatus}</div>`;

      const toggleDetail = () => {
        highlightArrow(book);
        const wasOpen = detail.classList.contains('open');
        panel.querySelectorAll('.flagged-item-detail').forEach(d => d.classList.remove('open'));
        panel.querySelectorAll('.flagged-item').forEach(r => r.setAttribute('aria-expanded', 'false'));
        if (!wasOpen) { detail.classList.add('open'); row.setAttribute('aria-expanded', 'true'); }
      };
      row.onclick = toggleDetail;
      row.onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleDetail(); }
      };

      panel.appendChild(row);
      panel.appendChild(detail);
    }
    panel.classList.add('show');
  }

  function newScan() {
    document.getElementById('resultsOverlay')?.remove();
    document.getElementById('debugOverlay')?.remove();
    const panel = document.getElementById('flaggedList');
    panel.classList.remove('show'); panel.innerHTML = '';
    lastRawBooks = null; lastCheckedBooks = [];
    retake();
  }

  // ── Debug mode ────────────────────────────────────────────────────────────
  let debugMode = false;
  const settingsBtn  = document.getElementById('settingsBtn');
  const settingsMenu = document.getElementById('settingsMenu');
  const debugToggle  = document.getElementById('debugToggle');
  const debugSwitch  = document.getElementById('debugToggleSwitch');

  settingsBtn.addEventListener('click', e => {
    e.stopPropagation();
    const show = settingsMenu.classList.toggle('show');
    settingsBtn.setAttribute('aria-expanded', String(show));
  });
  document.addEventListener('click', () => { settingsMenu.classList.remove('show'); settingsBtn.setAttribute('aria-expanded', 'false'); });
  settingsMenu.addEventListener('click', e => e.stopPropagation());
  debugToggle.addEventListener('click', () => {
    debugMode = !debugMode;
    debugSwitch.classList.toggle('on', debugMode);
    debugToggle.setAttribute('aria-checked', String(debugMode));
    settingsBtn.classList.toggle('debug-active', debugMode);
    document.getElementById('debugBadge')?.remove();
    if (debugMode) {
      const badge = document.createElement('div');
      badge.id = 'debugBadge'; badge.className = 'debug-badge'; badge.textContent = 'DEBUG';
      document.querySelector('.header').appendChild(badge);
    }
    settingsMenu.classList.remove('show');
    settingsBtn.setAttribute('aria-expanded', 'false');
  });

  const geminiToggle = document.getElementById('geminiToggle');
  const geminiSwitch  = document.getElementById('geminiToggleSwitch');
  geminiSwitch.classList.toggle('on', localOcrEnabled);
  geminiToggle.setAttribute('aria-checked', String(localOcrEnabled));
  geminiToggle.addEventListener('click', () => {
    localOcrEnabled = !localOcrEnabled;
    localStorage.setItem('shelfcheck.localocr', localOcrEnabled ? '1' : '0');
    geminiSwitch.classList.toggle('on', localOcrEnabled);
    geminiToggle.setAttribute('aria-checked', String(localOcrEnabled));
    settingsMenu.classList.remove('show');
    settingsBtn.setAttribute('aria-expanded', 'false');
    if (localOcrEnabled && window.LocalOCR && LocalOCR.available()) {
      LocalOCR.preload().catch(() => {});
    }
  });

  // Warm the local engine as soon as the page is idle: the one-time ~31MB
  // model download plus session compile happens while the user lines up the
  // shot instead of inside the first scan.
  if (localOcrEnabled) {
    const warm = () => {
      if (window.LocalOCR && LocalOCR.available()) LocalOCR.preload().catch(() => {});
    };
    if ('requestIdleCallback' in window) requestIdleCallback(warm, { timeout: 4000 });
    else setTimeout(warm, 1500);
  }


  function showTimingBadge(prepMs, apiMs, ocrMs) {
    document.getElementById('timingBadge')?.remove();
    const fmt   = ms => (ms / 1000).toFixed(1) + 's';
    const badge = document.createElement('div');
    badge.id = 'timingBadge'; badge.className = 'timing-badge';
    badge.innerHTML =
      `⏱ prep <b>${fmt(prepMs)}</b> · network <b>${fmt(apiMs)}</b> · ocr <b>${fmt(ocrMs)}</b>`;
    photoArea.appendChild(badge);
    badge.onclick = () => badge.remove();
    setTimeout(() => badge.remove(), 12000);
  }

  // Debug analyze: runs OCR and shows a full results table without rendering the normal UI.
  async function analyzeShelfDebug() {
    analyzeBtn.disabled    = true;
    analyzeBtn.textContent = 'Processing…';
    await new Promise(r => setTimeout(r, 50));

    let encoded;
    try { encoded = await encodeForOCR(); } catch (err) {
      analyzeBtn.disabled = false; analyzeBtn.textContent = 'Analyze';
      showErrorBanner('Could not encode image.', () => analyzeShelfDebug());
      return;
    }

    const overlay = document.createElement('div');
    overlay.id = 'debugOverlay'; overlay.className = 'debug-overlay';
    overlay.innerHTML = `
      <div class="debug-section">
        <div class="debug-section-title">Image sent to OCR (${encoded.sentW}×${encoded.sentH})</div>
        <img style="width:100%;border-radius:8px;border:1px solid #333" src="${URL.createObjectURL(encoded.blob)}" />
      </div>
      <div class="debug-section" id="debugResultsSection">
        <div class="debug-section-title">OCR Results</div>
        <div style="color:#888;font-size:13px;text-align:center;padding:20px 0">Tap "Send to OCR" below</div>
      </div>
      <div class="debug-actions">
        <button class="btn btn-retake" id="debugClose">Close</button>
        <button class="btn btn-analyze" id="debugSend">Send to OCR</button>
      </div>`;
    cameraWrap.appendChild(overlay);

    document.getElementById('debugClose').onclick = () => {
      overlay.remove(); analyzeBtn.disabled = false; analyzeBtn.textContent = 'Analyze';
    };

    document.getElementById('debugSend').onclick = async () => {
      const sendBtn = document.getElementById('debugSend');
      sendBtn.disabled = true; sendBtn.textContent = 'Reading…';
      const rd = document.getElementById('debugResultsSection');
      rd.innerHTML = `<div class="debug-section-title">OCR Results</div>
        <div style="color:#888;font-size:13px;text-align:center;padding:20px 0">Waiting…</div>`;
      try {
        const t0      = performance.now();
        const data    = await runOcr(encoded, null, null);
        const elapsed = Math.round(performance.now() - t0);
        const section = getSection();
        const books   = labelsToBooks(data.labels);
        const checked = checkOrder(books, section);
        const out = checked.filter(b => b.outOfOrder).length;
        const unv = checked.filter(b => b.unverifiable || b.possiblyOutOfOrder).length;
        const ok  = checked.length - out - unv;
        let html = `<div class="debug-section-title">
            ${data.n} labels · ${data.ms}ms OCR · ${elapsed}ms total ·
            <span style="color:#4ade80">${ok} ok</span>
            <span style="color:#ef4444"> ${out} out</span>
            <span style="color:#eab308"> ${unv} check</span>
          </div><div style="overflow-x:auto">
          <table class="debug-book-table">
            <tr><th>#</th><th>Label</th><th>Score</th><th>Row</th><th>Status</th></tr>`;
        checked.forEach((b, i) => {
          const cls = b.outOfOrder ? 'book-bad' : (b.unverifiable || b.possiblyOutOfOrder) ? 'book-unv' : 'book-ok';
          const status = b.outOfOrder ? `<span style="color:#ef4444">→ slot ${b.idealPosition ?? '?'}</span>`
                       : b.possiblyOutOfOrder ? '<span style="color:#eab308">title order?</span>'
                       : b.unverifiable ? '<span style="color:#eab308">Check</span>'
                       : '<span style="color:#4ade80">OK</span>';
          html += `<tr class="${cls}"><td>${i + 1}</td><td>${escapeHtml(b.spine_label || '—')}</td>
            <td>${Math.round((b._score || 0) * 100)}%</td><td>${(b.shelfIndex ?? 0) + 1}</td><td>${status}</td></tr>`;
        });
        html += `</table></div>`;
        rd.innerHTML = html;
        lastRawBooks = books; lastApiDims = { sentW: data.imageSize[0], sentH: data.imageSize[1] };
      } catch (err) {
        rd.innerHTML = `<div class="debug-section-title">OCR Results</div>
          <div style="color:#f87171;font-size:13px;padding:12px 0">Error: ${escapeHtml(err.message)}</div>`;
      }
      sendBtn.disabled = false; sendBtn.textContent = 'Send Again';
    };
  }

  analyzeBtn.addEventListener('click', () => {
    if (debugMode) analyzeShelfDebug();
    else analyzeShelf();
  });

  // ── Utilities ─────────────────────────────────────────────────────────────
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ── First-run hint ────────────────────────────────────────────────────────
  function maybeShowFirstHint() {
    let seen = false;
    try { seen = localStorage.getItem('shelfcheck.hintSeen') === '1'; } catch {}
    if (seen) return;
    const hint = document.createElement('div');
    hint.className = 'first-hint';
    hint.setAttribute('role', 'dialog');
    hint.setAttribute('aria-label', 'How ShelfCheck works');
    hint.innerHTML = `
      <div class="first-hint-card">
        <h3>How ShelfCheck works</h3>
        <div class="first-hint-row">
          <span class="first-hint-dot" style="background:#3b82f6"></span>
          <span>Hold your phone <b>upright</b> and pan across the shelf. Get close enough that the white label stickers are sharp.</span>
        </div>
        <div class="first-hint-row">
          <span class="first-hint-dot" style="background:#ef4444"></span>
          <span><b>Red box</b> on the photo = out of order — listed below with its box number.</span>
        </div>
        <div class="first-hint-row">
          <span class="first-hint-dot" style="background:#eab308"></span>
          <span><b>Yellow box</b> = label unclear — check it by eye.</span>
        </div>
        <div class="first-hint-row">
          <span class="first-hint-dot" style="background:#22c55e"></span>
          <span><b>Green box</b> = in order. Tap a flagged item below for details.</span>
        </div>
        <button class="first-hint-btn" id="firstHintBtn">Got it</button>
      </div>`;
    photoArea.appendChild(hint);
    document.getElementById('firstHintBtn').onclick = () => {
      hint.remove();
      try { localStorage.setItem('shelfcheck.hintSeen', '1'); } catch {}
    };
  }

  maybeShowFirstHint();
</script>
