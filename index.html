    // ever gain confidence for a label, never take it away, so it can't
    // introduce a false misshelving flag on its own.
    if (oOnly.length && gOnly.length) {
      const rescues = [];
      for (const oi of oOnly) {
        for (const gi of gOnly) {
          if (fuseNorm(oTexts[oi]) !== fuseNorm(gTexts[gi])) continue;
          rescues.push([oi, gi]);
        }
      }
      const usedO = new Set(), usedG = new Set();
      for (const [oi, gi] of rescues) {
        if (usedO.has(oi) || usedG.has(gi)) continue;
        usedO.add(oi); usedG.add(gi);
        pairs.push([oi, gi]);
      }
      if (usedO.size) {
        for (let k = oOnly.length - 1; k >= 0; k--) if (usedO.has(oOnly[k])) oOnly.splice(k, 1);
        for (let k = gOnly.length - 1; k >= 0; k--) if (usedG.has(gOnly[k])) gOnly.splice(k, 1);
        pairs.sort((a, b) => a[0] - b[0]);
      }
    }

    return { pairs, oOnly, gOnly };
  }

  // OCR sometimes merges 2-4 adjacent spines' text into a single wide line
  // (e.g. "WAGANWAGAMES WAGGONER WAGGONE RichardRichard Tim"). Left as one
  // anchor, this starves the aligner: a run of several distinct GT labels
  // has only one real OCR box to pair against, so the rest fall through to
  // Gemini-only synthesis with poor bracketing anchors. Detect such lines by
  // width relative to the row's other spines and split them into evenly
  // sized sub-boxes (one per detected token group) before alignment, so each
  // fragment can independently pair with a Gemini candidate. Implemented as
  // a pre-alignment step here (not inside reconstructFiction) so the
  // parity-checked reconstruction output stays untouched.
  function splitWideOcrLabels(labels) {
    if (labels.length < 2) return labels;
    const rows = [];
    for (const l of labels) {
      const cy = l.bbox[1] + l.bbox[3] / 2;
      let row = rows.find(r => Math.abs(r.cy - cy) <= l.bbox[3]);
      if (!row) { row = { cy, items: [] }; rows.push(row); }
      row.items.push(l);
    }
    const out = [];
    for (const row of rows) {
      const widths = row.items.map(l => l.bbox[2]).sort((a, b) => a - b);
      const medW = widths[Math.floor(widths.length / 2)];
      for (const l of row.items) {
        const tokens = String(l.text).trim().split(/\s+/).filter(Boolean);
        // Unusually wide AND enough tokens to plausibly hold multiple
        // names; long single-name lines are left untouched.
        if (medW > 0 && l.bbox[2] > medW * 1.6 && tokens.length >= 4) {
          const nSplit = Math.max(2, Math.min(4, Math.round(l.bbox[2] / medW)));
          const perGroup = Math.ceil(tokens.length / nSplit);
          const groups = [];
          for (let i = 0; i < tokens.length; i += perGroup) groups.push(tokens.slice(i, i + perGroup));
          const [x, y, w, h] = l.bbox;
          const segW = w / groups.length;
          groups.forEach((g, gi) => {
            out.push({ ...l, text: g.join(' '), bbox: [x + gi * segW, y, segW, h] });
          });
        } else {
          out.push(l);
        }
      }
    }
    return out;
  }

  // Cluster labels into shelf rows by sorting on box centerY and starting a
  // new row wherever the gap between consecutive centers exceeds a threshold.
  // Fixed-width banding (Math.round(cy/rowH)) split one physical shelf into
  // two rows whenever its sticker centers straddled a band edge, which made
  // OCR's row count disagree with Gemini's and forced fusion into the
  // degraded flatten path.
  function clusterRowIndex(labels, imgH) {
    const threshold = Math.max(imgH * 0.05, 24);
    const withCy = labels.map(l => ({ l, cy: l.bbox[1] + l.bbox[3] / 2 }));
    withCy.sort((a, b) => a.cy - b.cy);
    const rowMap = new Map();
    let row = -1;
    let prevCy = null;
    for (const { l, cy } of withCy) {
      if (prevCy === null || cy - prevCy > threshold) row++;
      rowMap.set(l, row);
      prevCy = cy;
    }
    return rowMap;
  }

  // Fuse ocr.space labels (geometry) with Gemini books (text) into a new
  // labels array in the same shape runOcr already produces.
  function fuseLabels(ocrLabels, gemBooks, imgW, imgH) {
    ocrLabels = splitWideOcrLabels(ocrLabels);
    const withRow = ocrLabels.map(l => ({ ...l }));
    const gems = gemBooks.map(b => ({ ...b }));
    if (gems.some(b => b.bbox)) {
      // Real gem sticker boxes (tile path): cluster BOTH sides' boxes jointly
      // so row indices live in one shared frame. Gemini's self-reported row
      // numbers used to skew whenever one side missed an entire shelf, which
      // forced the flatten fallback; joint gap-clustering gives both sides
      // the same numbering by construction.
      const joint = clusterRowIndex([...withRow, ...gems.filter(b => b.bbox)], imgH);
      for (const l of withRow) l._frow = joint.get(l);
      for (const b of gems) if (b.bbox) b.shelfRow = joint.get(b);
    } else {
      const frowMap = clusterRowIndex(withRow, imgH);
      for (const l of withRow) l._frow = frowMap.get(l);
    }

    const oRowCount = withRow.length ? 1 + Math.max(...withRow.map(l => l._frow)) : 0;
    const gRowCount = gems.length ? 1 + Math.max(...gems.map(b => b.shelfRow || 0)) : 0;

    const rows = [];
    if (oRowCount !== gRowCount) {
      // Flatten: one global alignment when row bucketing disagrees.
      const O = withRow.slice().sort((a, b) => a._frow - b._frow || a.bbox[0] - b.bbox[0]);
      const G = gems.slice().sort((a, b) => (a.shelfRow || 0) - (b.shelfRow || 0) || (a.bbox ? a.bbox[0] : 0) - (b.bbox ? b.bbox[0] : 0));
      rows.push({ O, G, flat: true });
    } else {
      for (let r = 0; r < oRowCount; r++) {
        const O = withRow.filter(l => l._frow === r).sort((a, b) => a.bbox[0] - b.bbox[0]);
        const G = gems.filter(b => (b.shelfRow || 0) === r).sort((a, b) => (a.bbox ? a.bbox[0] : 0) - (b.bbox ? b.bbox[0] : 0));
        rows.push({ O, G, flat: false });
      }
    }

    const fused = [];
    for (const { O, G, flat } of rows) {
      if (!O.length && !G.length) continue;
      const oTexts = O.map(l => l.text);
      const gTexts = G.map(g => g.spine_label || '');
      const { pairs, oOnly, gOnly } = fuseAlignRow(oTexts, gTexts);

      const rowOut = [];
      const matchedGIdx = new Set();
      for (const [oi, gi] of pairs) {
        const o = O[oi], g = G[gi];
        matchedGIdx.add(gi);
        let text, score, src;
        const NO = fuseNorm(o.text), NG = fuseNorm(g.spine_label);
        if (NO === NG) {
          text = o.text; score = 0.95; src = 'both';
        } else {
          // Cross-engine key agreement: both engines independently read the
          // same SORTING key (Dewey prefix + cutter, or surname) even if the
          // raw strings differ. That's the only other way a label becomes
          // flag-eligible — a misread by a single engine can then never
          // produce a false misshelving flag.
          const po = fuseParse(NO), pg = fuseParse(NG);
          const numOk = po.num && pg.num && (po.num.startsWith(pg.num) || pg.num.startsWith(po.num));
          const cutOk = po.cut && pg.cut && po.cut.slice(0, 3) === pg.cut.slice(0, 3);
          const surOk = !po.num && !pg.num && po.sur && pg.sur &&
                        (po.sur === pg.sur || fuseEditDist(po.sur, pg.sur) <= 1);
          if (numOk && cutOk && g.confidence === 'high') {
            // Agree on the key. Prefer the local read when it carries
            // decimals: its confidence is per-glyph and a high-conf
            // "635.04" is usually the real sticker, while the remote
            // extension "635.048" is often carried over from neighbors. A
            // bare local number ("635") yields to a longer remote read —
            // dropping the whole decimal block is the classic local
            // truncation. Real truncations that slip through are caught by
            // the truncation-shape recheck before they can flag.
            text = (pg.num.length > po.num.length || pg.num.includes('.')) ? g.spine_label : o.text;
            score = 0.9; src = 'both';
          } else if (surOk && g.confidence === 'high') {
            text = g.spine_label; score = 0.9; src = 'both';
          } else if (g.confidence === 'high') {
            text = g.spine_label; score = 0.6; src = 'gemini';
          } else {
            text = o.text; score = 0.6; src = 'ocr?';
          }
        }
        rowOut.push({
          text, bbox: o.bbox, score, src,
          title: g.title || null,
          title_score: g.confidence === 'high' ? 0.9 : 0.5,
        });
      }
      for (const oi of oOnly) {
        const o = O[oi];
        rowOut.push({ text: o.text, bbox: o.bbox, score: 0.6, src: 'ocr-only', title: null, title_score: null });
      }

      // Gemini-only spines with a real sticker box (tile path): place them
      // exactly where Gemini saw them — no OCR anchors or synthesis needed.
      // Confident reads only, same bar as the synthesized path below.
      const gOnlyNoBox = [];
      for (const gi of gOnly) {
        const g = G[gi];
        if (g.bbox) {
          if (g.spine_label) {
            // Single-engine finds are always shown but never flag-eligible
            // (0.6 < the 0.65 'high' bar): only cross-engine-confirmed reads
            // above can trigger a misshelving flag.
            rowOut.push({
              text: g.spine_label, bbox: g.bbox.slice(),
              score: g.confidence === 'high' ? 0.6 : 0.55,
              src: 'gemini-synth', synthBox: false,
              title: g.title || null, title_score: g.confidence === 'high' ? 0.9 : 0.5,
            });
          }
        } else {
          gOnlyNoBox.push(gi);
        }
      }

      // Gemini-only spines WITHOUT boxes (legacy full-frame reads, cached
      // test data): only synthesize when confident and the row has enough
      // matched anchors to place them geometrically.
      if (gOnlyNoBox.length && pairs.length >= 2) {
        const matchedByGPos = pairs.map(([oi, gi]) => ({ oi, gi, cx: O[oi].bbox[0] + O[oi].bbox[2] / 2 })).sort((a, b) => a.gi - b.gi);
        const ws = pairs.map(([oi]) => O[oi].bbox[2]);
        const hs = pairs.map(([oi]) => O[oi].bbox[3]);
        const ys = pairs.map(([oi]) => O[oi].bbox[1]);
        const medW = ws.slice().sort((a, b) => a - b)[Math.floor(ws.length / 2)];
        const medH = hs.slice().sort((a, b) => a - b)[Math.floor(hs.length / 2)];
        const medY = ys.slice().sort((a, b) => a - b)[Math.floor(ys.length / 2)];
        const gaps = matchedByGPos.slice(1).map((p, i) => p.cx - matchedByGPos[i].cx).filter(g => g > 1);
        const medGap = gaps.length ? gaps.slice().sort((a, b) => a - b)[Math.floor(gaps.length / 2)] : medW * 1.5;

        // Never silently drop a confident candidate for landing on a crowded
        // position — on dense rows (many more Gemini entries than OCR
        // anchors) that cascades into dropping the majority of correct
        // reads. Instead, group consecutive gOnly candidates that share the
        // same bracketing anchors and redistribute them evenly by rank
        // across the available room between those anchors, which guarantees
        // non-overlapping placement for any candidate count.
        const bracketOf = gi => {
          let left = null, right = null;
          for (const p of matchedByGPos) { if (p.gi < gi) left = p; if (p.gi > gi && !right) right = p; }
          return { left, right };
        };
        const confident = gOnlyNoBox.filter(gi => G[gi].spine_label && G[gi].confidence === 'high');
        let k = 0;
        while (k < confident.length) {
          const { left: left0, right: right0 } = bracketOf(confident[k]);
          let k2 = k + 1;
          while (k2 < confident.length) {
            const b = bracketOf(confident[k2]);
            if (b.left !== left0 || b.right !== right0) break;
            k2++;
          }
          const group = confident.slice(k, k2);
          const count = group.length;

          // Flatten path: anchors bracketing a gOnly candidate may belong to
          // different physical shelf rows (that's exactly why row bucketing
          // disagreed and forced the flatten in the first place), so the
          // row's global median y/h can land a synthesized box on the wrong
          // shelf. When both brackets exist AND their OCR anchors agree on
          // _frow, we have trustworthy local geometry — use the mean of the
          // two anchors' bbox[1]/bbox[3] instead of the global median so the
          // box actually sits on that shelf. When the brackets disagree (or
          // one is missing, e.g. an entire physical shelf OCR missed
          // outright), there's no better local geometry available; fall
          // back to the row's median placement rather than dropping the
          // candidate — an approximately-placed confident Gemini read still
          // beats losing it, and downstream scoring already demotes synth
          // entries (score 0.7, below the "high confidence" cutoff).
          if (flat) {
            let gy = medY, gh = medH;
            if (left0 && right0 && O[left0.oi]._frow === O[right0.oi]._frow) {
              gy = (O[left0.oi].bbox[1] + O[right0.oi].bbox[1]) / 2;
              gh = (O[left0.oi].bbox[3] + O[right0.oi].bbox[3]) / 2;
            }
            group.forEach((gi, idx) => {
              const g = G[gi];
              let cx;
              if (left0 && right0) cx = left0.cx + (right0.cx - left0.cx) * (idx + 1) / (count + 1);
              else if (left0) cx = left0.cx + medGap * (idx + 1);
              else if (right0) cx = right0.cx - medGap * (count - idx);
              else return;
              const bx = Math.max(0, Math.min(imgW - medW, cx - medW / 2));
              rowOut.push({
                text: g.spine_label, bbox: [bx, gy, medW, gh], score: 0.7, src: 'gemini-synth', synthBox: true,
                title: g.title || null, title_score: 0.9,
              });
            });
            k = k2;
            continue;
          }

          // Interior groups (bracketed on both sides) have a bounded, known
          // span to redistribute across. One-sided groups (off the start/end
          // of the row) extrapolate past the last real anchor using the
          // row's median gap; every confident candidate is still placed
          // (never silently dropped) — geometry is only ever approximate for
          // gemini-synth entries regardless, and downstream scoring already
          // demotes them (score 0.7, below the "high confidence" cutoff).
          group.forEach((gi, idx) => {
            const g = G[gi];
            let cx;
            if (left0 && right0) cx = left0.cx + (right0.cx - left0.cx) * (idx + 1) / (count + 1);
            else if (left0) cx = left0.cx + medGap * (idx + 1);
            else if (right0) cx = right0.cx - medGap * (count - idx);
            else return;
            const bx = Math.max(0, Math.min(imgW - medW, cx - medW / 2));
            rowOut.push({
              text: g.spine_label, bbox: [bx, medY, medW, medH], score: 0.7, src: 'gemini-synth', synthBox: true,
              title: g.title || null, title_score: 0.9,
            });
          });
          k = k2;
        }
      }

      rowOut.sort((a, b) => a.bbox[0] - b.bbox[0]);
      fused.push(...rowOut);
    }
    return fused;
  }
  // ── End Gemini fusion ────────────────────────────────────────────────────

  // Build full-resolution left/right tile blobs for nonfiction OCR.
  // Sticker text is tiny; sending native-resolution halves instead of one
  // downscaled frame nearly doubles the pixels per sticker.
  async function encodeTilesForOCR() {
    const t0 = performance.now();
    const W = snapshot.width, H = snapshot.height;
    const ov = Math.round(W * 0.05);
    const cuts = [
      { x: 0,                      w: Math.floor(W / 2) + ov },
      { x: Math.floor(W / 2) - ov, w: W - (Math.floor(W / 2) - ov) },
    ];
    // Crop straight from the snapshot and apply the contrast/saturate
    // enhancement per tile, instead of first filtering a whole extra
    // full-resolution (up to 4096px) canvas just to crop plain copies out of
    // it. Total filtered-pixel count is about the same (two ~half-width
    // tiles vs one full-width pass, plus the small overlap strip), but this
    // avoids allocating/filtering a full 4096px canvas that was only ever
    // used as a crop source. `canvas` below is the plain snapshot itself —
    // callers use it only for local luminance sampling (reconstruction
    // heuristics), which doesn't need the OCR-side contrast boost.
    // Encode both tiles concurrently — they're independent canvases, so this
    // roughly halves the wall-clock cost of the encode step below.
    const tiles = await Promise.all(cuts.map(async c => {
      const tTile0 = performance.now();
      const t = document.createElement('canvas');
      t.width = c.w; t.height = H;
      const tctx = t.getContext('2d');
      tctx.filter = 'contrast(1.08) saturate(1.05)';
      tctx.drawImage(snapshot, c.x, 0, c.w, H, 0, 0, c.w, H);
      // At most 2 encode attempts: try a good-quality first pass, and if it
      // overshoots the 1MB cap, jump straight to a quality estimated from
      // the overshoot ratio instead of stepping down 0.05 at a time (was up
      // to 5 attempts/tile).
      let blob = await new Promise(r => t.toBlob(r, 'image/jpeg', 0.85));
      let attempts = 1;
      if (blob && blob.size > 1_000_000) {
        const q2 = Math.min(0.8, Math.max(0.5, 0.85 * Math.pow(1_000_000 / blob.size, 0.7)));
        blob = await new Promise(r => t.toBlob(r, 'image/jpeg', q2));
        attempts = 2;
      }
      console.log(`[perf] encodeTilesForOCR tile xoff=${c.x}: ${Math.round(performance.now() - tTile0)}ms, ${attempts} attempt(s), ${blob ? (blob.size/1024).toFixed(0)+'KB' : 'failed'}`);
      return { blob, xoff: c.x };
    }));
    console.log(`[perf] encodeTilesForOCR total: ${Math.round(performance.now() - t0)}ms`);
    return { tiles, canvas: snapshot };
  }

  // Returns true if any two labels share the same primary sort key and therefore
  // need a title to break the tie (same Dewey+Cutter for nonfiction, same
  // surname+first for fiction).  Uses the same parse functions as compareKeys.
  function hasPrimaryTies(labels, section) {
    const seen = new Set();
    for (const lbl of labels) {
      let k;
      if (section === 'fiction') {
        const p = parseSurnameAndFirst(lbl.text);
        if (!p) continue;
        k = p.surname + '\x00' + (p.first || '');
      } else {
        const d = parseDewey(lbl.text);
        if (!d) continue;
        k = String(d.num ?? '') + '\x00' + (d.cut || '');
      }
      if (seen.has(k)) return true;
      seen.add(k);
    }
    return false;
  }

  // For each label that sits in a tied group AND has an OCR title, query
  // Open Library to confirm the title is real.  Confirmed titles are kept
  // (replaced with the canonical OL form); unconfirmed titles are cleared so
  // they don't pollute tiebreaking.
  // Session-level memo of Open Library lookups, keyed by
  // section + author-key + normalized title. In live AR mode the background
  // refine re-runs every ~20s over a largely unchanged shelf; without this,
  // every cycle re-queries Open Library for the identical tied titles. A hit
  // replays the stored resolution and skips the network call entirely. Only
  // definitive responses are cached — transient errors/timeouts are not, so a
  // blip doesn't poison a title permanently.
  const _olMemo = new Map();

  async function verifyTitlesOpenLibrary(labels, section, signal) {
    // Build a map of primary-key → [indices] to find tied groups.
    const groups = new Map();
    labels.forEach((lbl, i) => {
      let k;
      if (section === 'fiction') {
        const p = parseSurnameAndFirst(lbl.text);
        if (!p) return;
        k = p.surname + '\x00' + (p.first || '');
      } else {
        const d = parseDewey(lbl.text);
        if (!d) return;
        k = String(d.num ?? '') + '\x00' + (d.cut || '');
      }
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(i);
    });

    // Collect indices that actually need verification (tied + have a title).
    const toVerify = [];
    for (const [, idxs] of groups) {
      if (idxs.length < 2) continue;
      for (const i of idxs) { if (labels[i].title) toVerify.push(i); }
    }
    if (!toVerify.length) return;

    const t0 = performance.now();
    // Requests are issued SEQUENTIALLY (one at a time), not in parallel: Open
    // Library is a courtesy-rate free service, and the AR refine loop can fire
    // this repeatedly, so we keep the outbound rate polite (well under 1/sec
    // given per-call latency). A slow/rate-limiting Open Library must still not
    // stall the whole verification step, so a hard total budget aborts every
    // remaining call once it elapses — finishLabels (and any render awaiting
    // it) is never held up longer than this, regardless of how many labels
    // needed verification.
    const OL_BUDGET_MS = 5000;
    const budgetCtrl  = new AbortController();
    const budgetTimer = setTimeout(() => budgetCtrl.abort(), OL_BUDGET_MS);

    // Apply a resolved OL outcome (fresh or memoized) to a label.
    const applyOl = (lbl, r) => {
      if (r.kind === 'verified') { lbl.title = r.title; lbl.title_verified = true; }
      else if (r.kind === 'none') { lbl.title = null; lbl.title_verified = false; }
      else { lbl.title_verified = false; }   // 'weak' — keep raw read, display only
    };

    let calls = 0, memoHits = 0;
    for (const i of toVerify) {
      const lbl = labels[i];
      const rawTitle = lbl.title;
      // Author component of the memo key: surname for fiction, call number +
      // cutter for nonfiction (both scope the OL query the same way).
      let authorKey = '';
      if (section === 'fiction') {
        const p = parseSurnameAndFirst(lbl.text);
        authorKey = p?.surname || '';
      } else {
        const d = parseDewey(lbl.text);
        authorKey = d ? (String(d.num ?? '') + (d.cut || '')) : '';
      }
      const memoKey = section + '\x00' + authorKey + '\x00' + lettersLower(rawTitle);
      if (_olMemo.has(memoKey)) { applyOl(lbl, _olMemo.get(memoKey)); memoHits++; continue; }

      // Once the total budget is spent, stop making calls; remaining tied books
      // keep their raw (unverified) title and stay tie-safe.
      if (signal?.aborted || budgetCtrl.signal.aborted) { lbl.title_verified = false; continue; }

      const params = new URLSearchParams({ title: lbl.title, limit: '3', fields: 'title,author_name' });
      if (section === 'fiction' && authorKey) params.set('author', authorKey);
      // Open Library is a third-party API with no SLA — a single slow request
      // must never be able to hang the whole analysis. Bound each call and
      // treat a timeout exactly like a network error: keep the raw title but
      // mark it unverified rather than block.
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), OL_TIMEOUT_MS);
      const onAbort = () => ctrl.abort();
      if (signal) {
        if (signal.aborted) ctrl.abort();
        else signal.addEventListener('abort', onAbort, { once: true });
      }
      if (budgetCtrl.signal.aborted) ctrl.abort();
      else budgetCtrl.signal.addEventListener('abort', onAbort, { once: true });
      try {
        calls++;
        const res = await fetch(`https://openlibrary.org/search.json?${params}`,
          { signal: ctrl.signal, headers: { 'Accept': 'application/json' } });
        const data = await res.json();
        const olTitle = data.numFound > 0 ? data.docs[0]?.title : null;
        let result;
        if (olTitle) {
          // Guard against Open Library matching a DIFFERENT book by the same
          // author: only trust the hit for ordering when its title words
          // actually overlap what we read off the spine. A weak match keeps
          // the raw read for display but stays unverified, so it can never
          // reorder a same-author run into a false misshelving flag.
          const rTok = new Set(lettersLower(rawTitle).split(/\s+/).filter(w => w.length >= 3));
          const oTok = lettersLower(olTitle).split(/\s+/).filter(w => w.length >= 3);
          const overlap = oTok.length ? oTok.filter(w => rTok.has(w)).length / oTok.length : 0;
          result = overlap >= 0.5 ? { kind: 'verified', title: olTitle } : { kind: 'weak' };
        } else {
          result = { kind: 'none' };   // unrecognised — don't use for ordering
        }
        _olMemo.set(memoKey, result);   // definitive response — safe to memoize
        applyOl(lbl, result);
      } catch {
        lbl.title_verified = false;  // network error, timeout, or budget abort — keep raw title, don't memoize
      } finally {
        clearTimeout(timer);
        if (signal) signal.removeEventListener('abort', onAbort);
        budgetCtrl.signal.removeEventListener('abort', onAbort);
      }
    }
    clearTimeout(budgetTimer);
    console.log(`[perf] verifyTitlesOpenLibrary: ${calls} call(s), ${memoHits} memo hit(s), ${Math.round(performance.now() - t0)}ms`);
  }

  // The on-device title reader returns the whole spine line (author name mixed
  // with the title, plus the odd stray glyph). Drop pure-symbol tokens and the
  // author surname so Open Library's title search matches on the title words.
  function cleanSpineTitle(raw, spineLabel) {
    const sur = (parseSurnameAndFirst(spineLabel)?.surname || '')
      .toUpperCase().replace(/[^A-Z]/g, '');
    const toks = String(raw).split(/\s+/).filter(t => {
      if (!/[A-Za-z]/.test(t)) return false;                       // stray symbols/CJK
      if (sur && t.toUpperCase().replace(/[^A-Z]/g, '') === sur) return false;  // author surname
      return true;
    });
    return toks.join(' ').replace(/\s+/g, ' ').trim();
  }

  // Read spine titles (on-device) for books that share a primary sort key and
  // so need a title to break the tie. Only runs when a tie exists — titles are
  // never read for the whole shelf. Populated titles are confirmed against
  // Open Library by the caller; an unconfirmed read is dropped and never feeds
  // ordering, so a garbled title can't create a false flag.
  async function readTiedTitles(labels, imgW, imgH, tieSect, signal) {
    if (!(localOcrEnabled && window.LocalOCR && LocalOCR.available() && snapshot.width)) return;
    const groups = new Map();
    labels.forEach((l, i) => {
      let k;
      if (tieSect === 'fiction') {
        const p = parseSurnameAndFirst(l.text); if (!p) return;
        k = p.surname + '\x00' + (p.first || '');
      } else {
        const d = parseDewey(l.text); if (!d) return;
        k = String(d.num ?? '') + '\x00' + (d.cut || '');
      }
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(i);
    });
    const tied = [];
    for (const idxs of groups.values()) if (idxs.length >= 2) tied.push(...idxs);
    if (!tied.length) return;
    const fx = snapshot.width / imgW, fy = snapshot.height / imgH;
    const t0 = performance.now();
    let got = 0, read = 0;
    // Hard time budget: reading titles is ~0.4s each, and a shelf can carry
    // dozens of tied books. This runs in the background refine (never blocks
    // first render), but still cap it so it can't run for half a minute. Tie
    // groups not reached simply stay tie-safe (any order, no flag).
    const TITLE_BUDGET_MS = 6000;
    for (const i of tied) {
      if (signal?.aborted || performance.now() - t0 > TITLE_BUDGET_MS) break;
      const b = labels[i].bbox;
      if (!b || labels[i].title) continue;
      read++;
      const tt = await LocalOCR.readTitle(snapshot, [b[0] * fx, b[1] * fy, b[2] * fx, b[3] * fy])
        .catch(() => null);
      if (tt && tt.title) {
        const cleaned = cleanSpineTitle(tt.title, labels[i].text);
        // Keep the read confidence alongside the title so the unverified
        // title-order pass (checkOrderOneShelf) can apply a quality bar — a
        // low-confidence spine read must not be able to raise "possibly out
        // of order". Currently the conf was dropped here.
        if (cleaned.length >= 3) { labels[i].title = cleaned; labels[i].title_conf = tt.conf; got++; }
      }
    }
    console.log(`[perf] finishLabels: read ${got}/${read} spine title(s) (${tied.length} tied) in ${Math.round(performance.now() - t0)}ms`);
  }

  // Fuse (if gem is provided), tie-check, verify tied titles against Open
  // Library, and assign shelfRow — the tail of the pipeline shared by both
  // the immediate (OCR-only or Gemini-on-time) render and the later refine
  // pass once a slow Gemini call finally resolves. Mutates/sorts `labels`
  // in place except when fuseLabels swaps in a brand-new fused array.
  async function finishLabels(labels, imgW, imgH, gem, section, signal, opts = {}) {
    // Fuse Gemini's text reads onto the ocr.space boxes before anything else
    // (tie-checking, titles, ordering) touches the labels.
    if (gem && gem.length) {
      const nBefore = labels.length;
      labels = fuseLabels(labels, gem, imgW, imgH);
      console.log(`[perf] finishLabels: fused ${nBefore} ocr + ${gem.length} gem (${gem.filter(g => g.bbox).length} boxed, ${gem.filter(g => g.confidence === 'high').length} high-conf) -> ${labels.length} labels`);
    }

    // Only use Call 2 (titles + OL verification) when two or more labels share
    // the same primary sort key and genuinely need a title to break the tie.
    // Use auto-detected section for the tie check so we get the right key type.
    const rawBooks = labels.map(l => ({ spine_label: l.text }));
    const tieSect = autoDetectSection(rawBooks) || section;
    const needsTitles = hasPrimaryTies(labels, tieSect);

    // Titles now come from Gemini (fused above) instead of a separate rotated
    // ocr.space call. Only verify against Open Library when a tie genuinely
    // needs a title to break it — cheap, parallel, ties only. If Gemini didn't
    // run or found no titles, this simply no-ops and tied books fall into the
    // existing tiedSlots handling (any order within a tie group is OK).
    // Fiction ties are exempt groups (ordering ignores titles for fiction),
    // so verifying their titles buys nothing — skip OL entirely for fiction.
    // Fiction now also tie-breaks on verified titles (series/volume first, then
    // title A-Z; see sortKey), so verify fiction ties against OL too. Only
    // OL-verified titles feed ordering; a budget-abort/timeout leaves the title
    // unverified so the tie stays a no-flag exempt group.
    // Title reading is slow (~0.4s per tied book) and only refines ordering
    // within same-key groups, so it runs solely in the background refine pass
    // (opts.readTitles) — never on the blocking first render.
    if (needsTitles && opts.readTitles) {
      await readTiedTitles(labels, imgW, imgH, tieSect, signal);
    }
    if (needsTitles && labels.some(l => l.title)) {
      await verifyTitlesOpenLibrary(labels, tieSect, signal);
    }

    // Assign shelfRow via gap-based clustering (see clusterRowIndex) instead
    // of fixed-height banding, so a shelf's stickers stay one row even when
    // their centers straddle where a fixed band edge would have fallen.
    const rowMap = clusterRowIndex(labels, imgH);
    for (const lbl of labels) lbl._row = rowMap.get(lbl);
    labels.sort((a, b) => a._row - b._row || a.bbox[0] - b.bbox[0]);
    for (const lbl of labels) lbl.shelfRow = lbl._row;

    // Row-consensus truncation guard (nonfiction): when nearly every
    // high-confidence label in a row carries decimals, a bare "635 XXX" read
    // is almost certainly a truncated "635.0xx XXX" — both engines clip the
    // same tiny digits — and bare sorts before every decimal, so one such
    // read false-flags real books. Demote it below the flag bar. Rows that
    // are genuinely bare (whole 635 GAR shelves) keep >20% bare and are
    // untouched.
    if (section === 'nonfiction') {
      const rows = new Map();
      for (const l of labels) {
        if (l.score < 0.65) continue;
        const m = /^\s*(\d{1,3})(\.\d+)?/.exec(l.text);
        if (!m) continue;
        if (!rows.has(l._row)) rows.set(l._row, { bare: 0, dec: 0 });
        rows.get(l._row)[m[2] ? 'dec' : 'bare']++;
      }
      for (const l of labels) {
        if (l.score < 0.65) continue;
        const m = /^\s*(\d{1,3})(\.\d+)?/.exec(l.text);
        if (!m || m[2]) continue;
        const r = rows.get(l._row);
        if (r && r.dec >= 4 && r.bare / (r.bare + r.dec) <= 0.2) l.score = 0.6;
      }
    }

    // Nonfiction labels start with the call number; anything glued on before
    // it ("TIMBER 635.028 HOL" — publisher text from the spine) derails the
    // sort key into a bogus flag. Strip the junk prefix.
    if (section === 'nonfiction') {
      for (const l of labels) {
        l.text = l.text.replace(/^[^\d]{2,24}?\s+(?=\d{1,3}(?:\.\d+)?(?:\s|$))/, '');
      }
    }

    const out = labels.map(l => ({
      text:           l.text,
      score:          l.score,
      bbox:           l.bbox,
      quad:           null,
      shelfRow:       l.shelfRow,
      title:          l.title          || null,
      title_score:    l.title_score    || null,
      title_conf:     l.title_conf     ?? null,
      title_verified: l.title_verified ?? false,
      src:            l.src            || 'ocr',
    }));

    // Verify-before-accusing: a false misshelving flag is the worst mistake
    // this app can make, so every label a provisional order check would flag
    // gets one extra high-zoom local re-read of its own sticker. A longer
    // Dewey decimal that extends the current read repairs a truncation (the
    // common false-flag cause — "635.04" read off a 635.0484 sticker); a
    // conflicting key demotes the label below the flag bar; agreement keeps
    // the flag. The final checkOrder in showResults then re-derives flags
    // from the corrected labels.
    if (localOcrEnabled && window.LocalOCR && LocalOCR.available() && snapshot.width) {
      try {
        const provisional = checkOrder(labelsToBooks(out), tieSect);
        const fx = snapshot.width / imgW, fy = snapshot.height / imgH;
        // Per-row Dewey class census: a lone class one character off from the
        // row's dominant class ("535.048" in a row of 635.048s) is a
        // correlated misread — both engines confuse the same glyph — not a
        // misshelved book, so it must never flag.
        const rowClass = new Map();
        if (tieSect === 'nonfiction') {
          for (const o of out) {
            const m = /^\s*(\d{3})\./.exec(o.text);
            if (!m || o.score < 0.65) continue;
            if (!rowClass.has(o.shelfRow)) rowClass.set(o.shelfRow, new Map());
            const cm = rowClass.get(o.shelfRow);
            cm.set(m[1], (cm.get(m[1]) || 0) + 1);
          }
        }
        for (let i = 0; i < provisional.length; i++) {
          if (!provisional[i].outOfOrder || !out[i].bbox) continue;
          if (signal?.aborted) break;
          if (tieSect === 'nonfiction') {
            const myCls = (/^\s*(\d{3})\./.exec(out[i].text) || [])[1];
            const cm = rowClass.get(out[i].shelfRow);
            if (myCls && cm) {
              let modal = null, modalN = 0;
              for (const [c, n] of cm) if (n > modalN) { modal = c; modalN = n; }
              if (modal !== myCls && modalN >= 4 && (cm.get(myCls) || 0) <= 1 &&
                  fuseEditDist(myCls, modal) === 1) {
                out[i].score = Math.min(out[i].score, 0.6);
                console.log(`[perf] finishLabels: class-outlier demote "${out[i].text}" (row modal ${modal})`);
                continue;
              }
            }
          }
          const b = out[i].bbox;
          const rr = await LocalOCR.readRegion(snapshot, [b[0] * fx, b[1] * fy, b[2] * fx, b[3] * fy])
            .catch(() => null);
          if (!rr || !rr.text) { out[i].score = Math.min(out[i].score, 0.6); continue; }
          const rTxt = normalizeLocalText(rr.text, tieSect);
          const oldP = fuseParse(fuseNorm(out[i].text)), newP = fuseParse(fuseNorm(rTxt));
          let verdict;
          if (tieSect === 'nonfiction') {
            // A crop that caught more than one sticker (two number tokens in
            // the re-read) proves nothing about THIS sticker — inconclusive,
            // so don't accuse.
            const numToks = (rTxt.match(/\d{1,3}\.\d+|\b\d{3}\b/g) || []).length;
            // Truncation-shaped flag: this book's number is a strict prefix
            // of BOTH in-order neighbors' numbers ("641.567" between two
            // 641.5676s). Stickers folded around the spine edge produce
            // exactly this, so only an exact re-read confirmation may keep
            // the flag — a shorter second read demotes it.
            const truncShape = (() => {
              if (!oldP.num) return false;
              let ext = 0;
              for (let j = 0; j < out.length; j++) {
                if (j === i || out[j].shelfRow !== out[i].shelfRow) continue;
                const nj = fuseParse(fuseNorm(out[j].text)).num;
                if (nj && nj !== oldP.num && nj.startsWith(oldP.num)) ext++;
              }
              return ext >= 3;
            })();
            if (!oldP.num || !newP.num || !oldP.cut || !newP.cut) verdict = 'demote';
            else if (numToks !== 1) verdict = 'demote';
            else if (newP.cut.slice(0, 3) !== oldP.cut.slice(0, 3)) verdict = 'demote';
            // Truncation-shaped flags can't be confirmed by re-reading the
            // same prefix — the hidden trailing digit is exactly what's in
            // question (stickers fold around the spine edge). Demote; only a
            // re-read that extends or contradicts the number resolves one.
            else if (newP.num === oldP.num) verdict = truncShape ? 'demote' : 'keep';
            else if (newP.num.startsWith(oldP.num) && rr.conf >= 0.9) verdict = 'repair';
            // recheck read LESS of the number than the original (a shorter
            // prefix): the original stands — don't punish the flag for a
            // worse second read (unless the flag is truncation-shaped)
            else if (oldP.num.startsWith(newP.num)) verdict = truncShape ? 'demote' : 'keep';
            else verdict = 'demote';
          } else {
            // Fiction flags usually hinge on a single character of the
            // surname, so a re-read that differs at all (even edit 1) is not
            // confirmation — only an exact surname match keeps the flag.
            // And a surname that's a strict prefix of several same-row
            // surnames ("WALD" among WALDMAN/WALDON) is truncation-shaped:
            // re-reading the same prefix proves nothing, so demote unless
            // the re-read extends it.
            const truncShapeF = (() => {
              if (!oldP.sur) return false;
              let ext = 0;
              for (let j = 0; j < out.length; j++) {
                if (j === i || out[j].shelfRow !== out[i].shelfRow) continue;
                const sj = fuseParse(fuseNorm(out[j].text)).sur;
                if (sj && sj !== oldP.sur && sj.startsWith(oldP.sur)) ext++;
              }
              return ext >= 2;
            })();
            if (!oldP.sur || !newP.sur) verdict = 'demote';
            else if (truncShapeF && newP.sur.length > oldP.sur.length &&
                     newP.sur.startsWith(oldP.sur) && rr.conf >= 0.9) verdict = 'repair';
            else if (truncShapeF) verdict = 'demote';
            else verdict = oldP.sur === newP.sur ? 'keep' : 'demote';
          }
          if (verdict === 'repair') { out[i].text = rTxt; }
          else if (verdict === 'demote') { out[i].score = Math.min(out[i].score, 0.6); }
          console.log(`[perf] finishLabels: recheck "${provisional[i].spine_label}" -> "${rTxt}" (${verdict})`);
        }
      } catch (e) {
        console.warn('flag recheck skipped:', e.message || e);
      }
    }

    return out;
  }

  // How long remote OCR results will wait for the in-flight local engine
  // before rendering without it. The local engine keeps running in the
  // background; if it lands after this grace window, runOcr's `refine`
  // promise carries the improved result so the caller can update the
  // already-rendered UI in place.
  const LOCAL_GRACE_MS = 1500;

  // Run the full OCR pipeline; returns {labels, ms, imageSize, n, refine}.
  // `refine` is null when local OCR either was disabled or answered within
  // the grace window (already folded into `labels`); otherwise it's a promise
  // that resolves to an improved {labels, imageSize, n} once local OCR lands,
  // or null if it ultimately failed/added nothing.
  // Calls onCall1Done() between the two proxy calls so the UI can advance stages.
  // ocr.space free tier throws transient 502s under back-to-back load; one
  // delayed retry recovers most of them. 4xx (bad request, file too large)
  // won't be fixed by retrying — rethrow those immediately.
  async function callOcrProxyWithRetry(blob, signal) {
    try { return await callOcrProxy(blob, signal); }
    catch (e) {
      if (signal?.aborted || (e.status && e.status < 500)) throw e;
      await new Promise(r => setTimeout(r, 1200));
      return callOcrProxy(blob, signal);
    }
  }

  async function runOcr(encoded, signal, onCall1Done, arOpts) {
    const t0 = performance.now();
    const section = getSection();
    // AR mode throttles the remote engine to protect the free-tier quota. When
    // `skipRemote` is set this cycle reads on-device only (no ocr.space call at
    // all); the local engine alone drives the render, so — by the sacred flag-
    // safety invariant — no red misshelving flag can be produced (single-engine
    // reads score below the 0.65 fuse bar).
    const arMode = !!(arOpts && arOpts.arMode);
    const skipRemote = !!(arOpts && arOpts.skipRemote);

    // The local engine fires immediately, in parallel with ocr.space, from
    // the full-res snapshot canvas (both the upload and AR paths draw into
    // it). They fail independently (device too old / models still downloading
    // vs 502 rate limits), so racing both means a scan only dies when BOTH
    // fail — and first render comes from whichever answers first.
    const localP = pendingLocal
      ?? ((localOcrEnabled && window.LocalOCR && LocalOCR.available())
        ? callLocalOcr(snapshot, signal).catch(() => null)
        : Promise.resolve(null));
    pendingLocal = null;

    const ocrP = skipRemote ? Promise.reject(new Error('remote skipped (AR throttle)')) : (async () => {
      let labels, imgW, imgH;
      if (section === 'fiction') {
        // Fiction stickers are large; one downscaled frame reads them fine.
        const data1 = await callOcrProxyWithRetry(encoded.blob, signal);
        labels = reconstructFiction(parseOcrOverlay(data1), encoded.canvas.getContext('2d'));
        imgW = encoded.sentW; imgH = encoded.sentH;
      } else {
        // Nonfiction stickers are tiny; OCR native-resolution L/R tiles.
        // Reuse the speculative pre-encode started at capture time if present —
        // same idea as pendingEncode, hides this cost behind photo-review time.
        const { tiles, canvas: fullCanvas } = await (pendingTiles ?? encodeTilesForOCR());
        pendingTiles = null;
        const datas = await Promise.all(tiles.map(t => callOcrProxyWithRetry(t.blob, signal)));
        const words = [];
        datas.forEach((d, i) => {
          for (const w of parseOcrWords(d)) { w.x += tiles[i].xoff; words.push(w); }
        });
        // Drop duplicate reads from the tile overlap zone.
        const dedup = [];
        for (const w of words) {
          if (!dedup.some(s => s.t === w.t && Math.abs(s.x - w.x) < 12 && Math.abs(s.y - w.y) < 12)) {
            dedup.push(w);
          }
        }
        labels = reconstructNonfiction(dedup, fullCanvas.getContext('2d'));
        imgW = fullCanvas.width; imgH = fullCanvas.height;
      }
      console.log(`[perf] runOcr: OCR call(s) done at ${Math.round(performance.now() - t0)}ms`);
      return { labels, imgW, imgH };
    })();

    // Track remote health so the AR loop can surface a persistent "online check
    // unavailable — local reads only" status (and keep serving on-device reads)
    // instead of going silent. Only meaningful when a remote call was actually
    // attempted; a throttled (skipRemote) cycle leaves the last verdict intact.
    if (arMode && !skipRemote) {
      ocrP.then(() => { arRemoteDown = false; }, () => { arRemoteDown = true; });
    }

    // First-success race. Whichever engine produces a usable result first
    // drives the first render; the other fuses in later as a background
    // refine. A local null/empty result counts as a loss, never a win.
    let first;
    try {
      first = await Promise.any([
        ocrP.then(r => ({ kind: 'ocr', r })),
        localP.then(g => {
          if (!g || !g.length) throw new Error('local OCR unavailable');
          return { kind: 'gem', g };
        }),
      ]);
    } catch {
      // Both sides failed — surface the OCR error (it has .status and the
      // friendlier message path that the error banner already understands).
      throw await ocrP.then(() => new Error('analysis failed'), e => e);
    }

    if (first.kind === 'gem') {
      // Local OCR won (ocr.space slow or down): render its reads with their
      // real sticker boxes now. If remote OCR eventually lands, fuse and
      // refine in place through the existing progressive-render path.
      const imgW = snapshot.width, imgH = snapshot.height;
      // Unconfirmed single-engine reads render at 0.6 (< the 0.65 flag bar):
      // the first paint shows every book with its box, and misshelving flags
      // appear moments later when the remote engine lands and the refine pass
      // cross-confirms the reads.
      const gemLabels = mapGemToPixels(first.g, imgW, imgH)
        .filter(b => b.spine_label)
        .map(b => ({
          text: b.spine_label, bbox: b.bbox,
          score: b.confidence === 'high' ? 0.6 : 0.4,
          src: 'gemini', title: b.title || null,
          title_score: b.confidence === 'high' ? 0.9 : 0.5,
        }));
      if (onCall1Done) onCall1Done();
      const finishedLabels = await finishLabels(gemLabels.map(l => ({ ...l })), imgW, imgH, null, section, signal);
      console.log(`[perf] runOcr: local-first render ready at ${Math.round(performance.now() - t0)}ms`);
      const refine = ocrP.then(async ({ labels: oLabels, imgW: oW, imgH: oH }) => {
        const gemPx = mapGemToPixels(first.g, oW, oH);
        const refined = await finishLabels(oLabels.map(l => ({ ...l })), oW, oH, gemPx, section, signal, { readTitles: true });
        return { labels: refined, imageSize: [oW, oH], n: refined.length };
      }).catch(() => null);
      return {
        labels: finishedLabels,
        ms: Math.round(performance.now() - t0),
        imageSize: [imgW, imgH],
        n: finishedLabels.length,
        refine,
      };
    }

    const { labels, imgW, imgH } = first.r;

    // Race the already-in-flight local promise against a short grace timer
    // instead of always awaiting it — a slow device must never hold up
    // remote OCR results that are already sitting in memory.
    const GRACE_TIMEOUT = Symbol('local-grace-timeout');
    let graceTimer;
    // Cap the grace window so a slow OCR round trip can't push first render
    // past the 5s budget: shrink the remaining grace to whatever's left of a
    // 4.3s deadline from the start of runOcr, floored at 250ms.
    const graceMs = Math.max(250, Math.min(LOCAL_GRACE_MS, 4300 - (performance.now() - t0)));
    const graceP = new Promise(r => { graceTimer = setTimeout(() => r(GRACE_TIMEOUT), graceMs); });
    const raced = localOcrEnabled ? await Promise.race([localP, graceP]) : null;
    clearTimeout(graceTimer);
    const gemOnTime = raced === GRACE_TIMEOUT || !raced ? null : mapGemToPixels(raced, imgW, imgH);
    console.log(`[perf] runOcr: local race resolved at ${Math.round(performance.now() - t0)}ms (${raced === GRACE_TIMEOUT ? 'grace won — rendering remote-only, local will refine' : raced ? 'local won — fused into first render' : 'local unavailable — remote-only'})`);

    if (onCall1Done) onCall1Done();

    const finishedLabels = await finishLabels(labels.map(l => ({ ...l })), imgW, imgH, gemOnTime, section, signal);
    console.log(`[perf] runOcr: finishLabels (first render) ready at ${Math.round(performance.now() - t0)}ms`);

    // Local OCR didn't make the grace window — hand the caller a promise that
    // resolves to a refined result once it (eventually) does, so the UI can
    // fuse it in without blocking the first render.
    let refine = null;
    if (raced === GRACE_TIMEOUT) {
      refine = localP.then(async gem => {
        if (!gem || !gem.length) return null;
        const gemPx = mapGemToPixels(gem, imgW, imgH);
        const refinedLabels = await finishLabels(labels.map(l => ({ ...l })), imgW, imgH, gemPx, section, signal, { readTitles: true });
        return { labels: refinedLabels, imageSize: [imgW, imgH], n: refinedLabels.length };
      }).catch(() => null);
    } else if (gemOnTime) {
      // Local already fused into the first render, so there's no engine still
      // in flight — but tied books still need their titles read to refine the
      // order. Schedule that as a background title-only refine.
      refine = (async () => {
        const refinedLabels = await finishLabels(labels.map(l => ({ ...l })), imgW, imgH, gemOnTime, section, signal, { readTitles: true });
        return { labels: refinedLabels, imageSize: [imgW, imgH], n: refinedLabels.length };
      })().catch(() => null);
    }

    return {
      labels: finishedLabels,
      ms: Math.round(performance.now() - t0),
      imageSize: [imgW, imgH],
      n: finishedLabels.length,
      refine,
    };
  }

  // Convert OCR label array to the book format the ordering logic expects.
  function labelsToBooks(labels) {
    return (labels || []).map(label => ({
      spine_label:    label.text,
      title:          label.title          || null,
      title_verified: label.title_verified ?? false,
      title_conf:     label.title_conf     ?? null,
      confidence:     label.score >= 0.65 ? 'high' : 'low',
      shelfRow:       label.shelfRow ?? 0,
      _bbox:          label.bbox,
      _score:         label.score,
      _title_score:   label.title_score || null,
      _src:           label.src || 'ocr',
    }));
  }

  // ── Loading stages ────────────────────────────────────────────────────────
  // Stage 1 covers ocr.space AND the parallel Gemini cross-check together (they
  // run concurrently). Stage 2 is Open Library title verification, which only
  // runs for tied labels and is now hard-capped at OL_TIMEOUT_MS per request.
  const LOADING_STAGES = ['Compressing image', 'Reading & cross-checking labels', 'Verifying titles', 'Checking order'];
  let _currentStage = -1;

  function _dotsHtml() { return '<span class="anim-dots"><span>.</span><span>.</span><span>.</span></span>'; }
  const STAGE_ICON = { done: '✓', pending: '○' };

  function _setStageState(i, state) {
    const row  = document.getElementById(`stage-row-${i}`);
    const icon = document.getElementById(`stage-icon-${i}`);
    if (!row || !icon) return;
    row.classList.toggle('s-done',   state === 'done');
    row.classList.toggle('s-active', state === 'active');
    icon.innerHTML = state === 'active' ? _dotsHtml() : STAGE_ICON[state];
  }

  function showLoading(parent = photoArea) {
    const overlay = document.createElement('div');
    overlay.id = 'loadingOverlay'; overlay.className = 'loading-overlay';
    const rows = LOADING_STAGES.map((label, i) => `
      <div class="stage-row" id="stage-row-${i}">
        <span class="stage-icon" id="stage-icon-${i}">${STAGE_ICON.pending}</span>
        <span class="stage-label">${label}</span>
      </div>`).join('');
    overlay.innerHTML = `<div class="stage-list">${rows}</div>
      <button class="loading-cancel" id="loadingCancel" style="margin-top:8px">Cancel</button>`;
    parent.appendChild(overlay);
    document.getElementById('loadingCancel').onclick = cancelAnalysis;
    resetStageTo(0);
  }

  function advanceStage() {
    _setStageState(_currentStage, 'done');
    _setStageState(++_currentStage, 'active');
  }

  function resetStageTo(idx) {
    LOADING_STAGES.forEach((_, i) =>
      _setStageState(i, i < idx ? 'done' : i === idx ? 'active' : 'pending'));
    _currentStage = idx;
  }

  function hideLoading() { document.getElementById('loadingOverlay')?.remove(); }

  // Small non-blocking pill shown while OCR-only results are already on
  // screen but the Gemini cross-check is still refining them in the
  // background (see runOcr's `refine` promise / LOCAL_GRACE_MS).
  function showRefiningBadge(parent = photoArea) {
    hideRefiningBadge();
    const badge = document.createElement('div');
    badge.id = 'refiningBadge'; badge.className = 'refining-badge';
    badge.setAttribute('role', 'status');
    badge.setAttribute('aria-live', 'polite');
    badge.innerHTML = `Refining results${_dotsHtml()}`;
    parent.appendChild(badge);
  }
  function hideRefiningBadge() { document.getElementById('refiningBadge')?.remove(); }

  // Cancels the classic (non-AR) still-photo analysis. The live AR loop has
  // no equivalent one-shot cancel — closing the camera (closeLiveCamera) is
  // how a scan in progress there is stopped.
  function cancelAnalysis() {
    analysisCancelled = true;
    analysisAbort?.abort();
    analysisGeneration++;   // invalidate any in-flight refine
    hideLoading();
    hideRefiningBadge();
    analyzeBtn.disabled    = false;
    analyzeBtn.textContent = 'Analyze';
    actionBar.classList.add('show');
  }

  // ── Main pipeline ─────────────────────────────────────────────────────────
  async function analyzeShelf() {
    analyzeBtn.disabled    = true;
    analyzeBtn.textContent = 'Reading…';
    analysisCancelled = false;
    analysisAbort     = new AbortController();
    const myGen = ++analysisGeneration;
    showLoading();

    // Yield two frames so the overlay paints before encoding blocks the thread.
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    const tAnalyze0 = performance.now();
    const tPrep0 = performance.now();
    let encoded;
    try {
      encoded = await (pendingEncode ?? encodeForOCR());
      pendingEncode = null;
    } catch (err) {
      if (analysisCancelled) return;
      hideLoading();
      showErrorBanner('Could not prepare the photo. Try retaking it.', () => analyzeShelf());
      analyzeBtn.disabled    = false;
      analyzeBtn.textContent = 'Analyze';
      return;
    }
    const prepTime = Math.round(performance.now() - tPrep0);
    console.log(`[perf] analyzeShelf: pendingEncode ready at ${prepTime}ms (${pendingEncode === null ? 'was pre-encoded' : ''})`);

    advanceStage();  // → "Reading labels"

    let ocrData, apiTime;
    try {
      const t0 = performance.now();
      ocrData = await runOcr(encoded, analysisAbort.signal, () => {
        if (!analysisCancelled) advanceStage();  // → "Reading titles"
      });
      apiTime = Math.round(performance.now() - t0);
    } catch (err) {
      if (analysisCancelled) return;
      hideLoading();
      showErrorBanner(friendlyErrorMessage(err), () => analyzeShelf());
      analyzeBtn.disabled    = false;
      analyzeBtn.textContent = 'Analyze';
      return;
    }

    if (analysisCancelled) return;

    advanceStage();  // → "Checking order"

    lastRawBooks = labelsToBooks(ocrData.labels);
    lastApiDims  = { sentW: ocrData.imageSize[0], sentH: ocrData.imageSize[1] };

    // Auto-detect section from label patterns and switch tab if confident
    const detected = autoDetectSection(lastRawBooks);
    if (detected) setActiveTab(detected);

    hideLoading();
    showResults(lastRawBooks, getSection());
    if (debugMode) showTimingBadge(prepTime, apiTime, ocrData.ms);
    console.log(`[perf] analyzeShelf: first render at ${Math.round(performance.now() - tAnalyze0)}ms total${ocrData.refine ? ' (refine pending)' : ''}`);

    analyzeBtn.disabled    = false;
    analyzeBtn.textContent = 'Analyze';

    // Gemini didn't land in time to be in the first render — results are
    // already on screen (OCR-only); refine them in place if/when it arrives.
    if (ocrData.refine) {
      showRefiningBadge(photoArea);
      ocrData.refine.then(refined => {
        if (myGen !== analysisGeneration) return;  // superseded by a newer scan
        hideRefiningBadge();
        console.log(`[perf] analyzeShelf: gemini refine landed at ${Math.round(performance.now() - tAnalyze0)}ms total (${refined ? 'applied' : 'no-op'})`);
        if (!refined) return;
        lastRawBooks = labelsToBooks(refined.labels);
        lastApiDims  = { sentW: refined.imageSize[0], sentH: refined.imageSize[1] };
        showResults(lastRawBooks, getSection());
      });
    }
  }

  function friendlyErrorMessage(err) {
    if (err.name === 'AbortError' || err.name === 'TimeoutError')
      return 'Reading timed out. Move closer, improve lighting, and tap Retry.';
    if (!navigator.onLine || /Failed to fetch|NetworkError/i.test(err.message))
      return "Couldn't reach the server. Check your connection.";
    if (err.status === 429) return 'Server is busy — wait a moment and retry.';
    if (err.status === 413) return 'Photo is too large. Try a lower camera resolution.';
    return `Analysis failed: ${err.message}`;
  }

  function showErrorBanner(message, onRetry, parent = photoArea) {
    document.getElementById('errorBanner')?.remove();
    const banner = document.createElement('div');
    banner.id = 'errorBanner'; banner.className = 'error-banner';
    banner.innerHTML = `<span class="error-banner-msg">${escapeHtml(message)}</span>
      <button class="error-banner-retry" id="errBannerRetry">Retry</button>`;
    parent.appendChild(banner);
    document.getElementById('errBannerRetry').onclick = () => { banner.remove(); onRetry(); };
  }

  // ── Bounding box drawing (classic still-photo view only) ────────────────
  // The live AR loop draws its own boxes (arRenderOverlay) since it tracks a
  // still-playing video instead of a static photo.
  function drawBoundingBoxes(checkedBooks, sentW, sentH, target = snapshot) {
    const ctx = target.getContext('2d');
    const sx  = target.width  / sentW;
    const sy  = target.height / sentH;
    const lw  = Math.max(2, Math.round(target.width / 450));
    const fs  = Math.max(11, Math.round(target.width / 65));

    ctx.save();
    ctx.font         = `bold ${fs}px sans-serif`;
    ctx.textBaseline = 'bottom';

    // Only flagged books (out of order, unverifiable, or possibly-out-of-order)
    // get a box — correct books are left unmarked so the photo isn't cluttered
    // with green boxes.
    const flagged = checkedBooks.filter(b => b._bbox && (b.outOfOrder || b.unverifiable || b.possiblyOutOfOrder));

    flagged.forEach((book) => {
      const i = checkedBooks.indexOf(book);
      const [bx, by, bw, bh] = book._bbox;
      const cx = bx * sx, cy = by * sy, cw = bw * sx, ch = bh * sy;
      // Red only for confirmed (fused+verified) out-of-order; both "unsure"
      // states (unverifiable label, possibly-out-of-order title) are yellow.
      const color = book.outOfOrder ? '#ef4444' : '#eab308';

      ctx.strokeStyle = color;
      ctx.lineWidth   = lw;
      if (book._src === 'gemini-synth') ctx.setLineDash([6, 4]);
      ctx.strokeRect(cx, cy, cw, ch);
      ctx.setLineDash([]);

      const num = String(i + 1);
      const tw  = ctx.measureText(num).width;
      ctx.fillStyle   = color;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(cx, cy - fs - 3, tw + 6, fs + 3);
      ctx.globalAlpha = 1;
      ctx.fillStyle   = '#000';
      ctx.fillText(num, cx + 3, cy - 2);
    });

    ctx.restore();
  }

  // Whether the live AR camera loop is currently running — used so
  // highlightArrow/popBoxPulse (shared between tapping the classic photo and
  // tapping a flagged-list row) pick the right panel/pulse element.
  let arActive = false;
  function activePanel()   { return arActive ? arSheet : document.getElementById('flaggedList'); }
  function activePulseEl() { return arActive ? arBoxPulse : boxPulse; }

  // Highlight one book in the flagged list, and pop its box on the photo so
  // it's easy to find (works whether triggered by tapping the list or the photo).
  function highlightArrow(book) {
    activePanel().querySelectorAll('.flagged-item').forEach(r => r.classList.remove('active'));
    const row = _flaggedRowMap.get(book);
    if (row) { row.classList.add('active'); row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    popBoxPulse(book);
  }

  // The canvas element's CSS box (getBoundingClientRect) is *not* the same
  // as the rectangle its image content actually occupies: #snapshot uses
  // object-fit: contain and is sized to fill its container, so a
  // portrait photo inside a wider container gets pillarboxed (bars on the
  // sides) while a landscape photo in a taller container gets letterboxed
  // (bars top/bottom). Any mapping between screen coordinates and image/box
  // coordinates must go through this sub-rectangle, not the raw CSS box —
  // otherwise taps land on the wrong book and the pop-highlight is
  // mispositioned whenever the photo's aspect ratio doesn't match its
  // container's (the common case for portrait shelf photos on desktop).
  function canvasContentRect(canvas) {
    const rect = canvas.getBoundingClientRect();
    if (!canvas.width || !canvas.height || !rect.width || !rect.height) {
      return { left: rect.left, top: rect.top, width: rect.width, height: rect.height, scale: 1 };
    }
    const scale  = Math.min(rect.width / canvas.width, rect.height / canvas.height);
    const width  = canvas.width  * scale;
    const height = canvas.height * scale;
    return {
      left: rect.left + (rect.width  - width)  / 2,
      top:  rect.top  + (rect.height - height) / 2,
      width, height, scale,
    };
  }

  const boxPulse   = document.getElementById('boxPulse');
  const arBoxPulse = document.getElementById('arBoxPulse');
  const arCaptionEl = document.getElementById('arCaption');

  // Small floating readout for tapping a green ("confidently correct") AR
  // box — red and grey boxes both already have a flagged-list row to open
  // instead (grey/unverifiable books are on that list same as red ones), so
  // this only ever fires for a book with neither flag.
  function arShowCaption(entry) {
    if (!entry._overlayRect) return;
    const dpr = window.devicePixelRatio || 1;
    const [ox, oy] = entry._overlayRect;
    const oRect = arLiveOverlay.getBoundingClientRect();
    const pRect = cameraLive.getBoundingClientRect();
    arCaptionEl.textContent = `${entry.book.spine_label || '(unreadable)'} — looks correct`;
    arCaptionEl.style.left = `${(oRect.left - pRect.left) + ox / dpr}px`;
    arCaptionEl.style.top  = `${(oRect.top  - pRect.top)  + oy / dpr - 28}px`;
    arCaptionEl.classList.add('show');
    clearTimeout(arCaptionEl._hideTimer);
    arCaptionEl._hideTimer = setTimeout(() => arCaptionEl.classList.remove('show'), 3000);
  }
  function arHideCaption() { arCaptionEl.classList.remove('show'); }

  function popBoxPulse(book) {
    const pulse = activePulseEl();
    // The classic still-photo view only ever draws (and lists) flagged
    // books, so a non-flagged book never reaches here in that mode anyway —
    // this guard only matters for classic mode. AR mode now draws (and can
    // pulse) a box for every book, including confidently-correct ones.
    if (!book?._bbox || !lastApiDims || (!arActive && !book.outOfOrder && !book.unverifiable)) {
      pulse.classList.remove('show');
      return;
    }

    if (arActive) {
      // AR boxes track a live, continuously panning/zooming video (see
      // arRenderOverlay), so there's no fixed sentW/sentH->canvas scaling to
      // reuse here — position from that box's last rendered overlay rect.
      const entry = arLastBoxes.find(en => en.book === book);
      if (!entry || !entry._overlayRect) { pulse.classList.remove('show'); return; }
      const dpr = window.devicePixelRatio || 1;
      const oRect = arLiveOverlay.getBoundingClientRect();
      const pRect = cameraLive.getBoundingClientRect();
      const [ox, oy, ow, oh] = entry._overlayRect;
      pulse.style.color  = book.unverifiable ? '#eab308' : '#ef4444';
      pulse.style.left   = `${(oRect.left - pRect.left) + ox / dpr}px`;
      pulse.style.top    = `${(oRect.top  - pRect.top)  + oy / dpr}px`;
      pulse.style.width  = `${ow / dpr}px`;
      pulse.style.height = `${oh / dpr}px`;
      pulse.classList.remove('show');
      void pulse.offsetWidth;
      pulse.classList.add('show');
      return;
    }

    const [bx, by, bw, bh] = book._bbox;
    const cRect = canvasContentRect(snapshot);
    const pRect = photoArea.getBoundingClientRect();
    const sx = cRect.width  / lastApiDims.sentW;
    const sy = cRect.height / lastApiDims.sentH;
    const left = (cRect.left - pRect.left) + bx * sx;
    const top  = (cRect.top  - pRect.top)  + by * sy;

    pulse.style.color  = book.unverifiable ? '#eab308' : '#ef4444';
    pulse.style.left   = `${left}px`;
    pulse.style.top    = `${top}px`;
    pulse.style.width  = `${bw * sx}px`;
    pulse.style.height = `${bh * sy}px`;

    // Restart the CSS animation even if the same book is tapped again.
    pulse.classList.remove('show');
    void pulse.offsetWidth;
    pulse.classList.add('show');
  }

  // ── Tap box to inspect ───────────────────────────────────────────────────
  // canvasW/canvasH are the target canvas's internal pixel dimensions (its
  // .width/.height, not its on-screen CSS size) — tapX/tapY must already be
  // in that same space (see the click listeners below).
  function hitTestBook(tapX, tapY, canvasW, canvasH) {
    if (!lastCheckedBooks.length || !lastApiDims) return null;
    const sx = canvasW / lastApiDims.sentW;
    const sy = canvasH / lastApiDims.sentH;
    return lastCheckedBooks.find(b => {
      if (!b._bbox) return false;
      const [bx, by, bw, bh] = b._bbox;
      return tapX >= bx * sx && tapX <= (bx + bw) * sx &&
             tapY >= by * sy && tapY <= (by + bh) * sy;
    }) || null;
  }

  // Expand a flagged book's detail row within a given panel (scoped so the
  // classic list and the AR sheet never interfere with each other).
  function openBookDetail(book, panel) {
    const row = _flaggedRowMap.get(book);
    if (!row) return;
    const detail = row.nextElementSibling;
    if (detail?.classList.contains('flagged-item-detail')) {
      panel.querySelectorAll('.flagged-item-detail').forEach(d => d.classList.remove('open'));
      detail.classList.add('open');
      row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  function handleCanvasTap(canvas, e) {
    const cr = canvasContentRect(canvas);
    const tapX = (e.clientX - cr.left) / cr.scale;
    const tapY = (e.clientY - cr.top)  / cr.scale;
    // Taps that land in the letterbox/pillarbox bars (outside the actual
    // image content) can't hit any book — bail before hit-testing so they
    // don't get mapped into extrapolated, meaningless image coordinates.
    if (tapX < 0 || tapY < 0 || tapX > canvas.width || tapY > canvas.height) {
      activePulseEl().classList.remove('show');
      return;
    }
    const hit = hitTestBook(tapX, tapY, canvas.width, canvas.height);
    if (hit) {
      highlightArrow(hit);
      openBookDetail(hit, activePanel());
    } else {
      activePulseEl().classList.remove('show');
    }
  }

  snapshot.addEventListener('click', e => handleCanvasTap(snapshot, e));

  // ── Ordering logic (identical to shelfcheck/index.html) ──────────────────
  const SURNAME_PREFIXES = new Set([
    'de','del','dela','di','du','la','le','les','lo','mac','mc',
    'o','van','von','st','san','santa','el','al','bin','ibn','da','das','dos',
  ]);

  function lettersLower(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

  // Multi-word surnames keep a space separator so comparison can file
  // word-by-word (library standard): "VON ZIEGESAR" files before "VONNEGUT"
  // because the first word "von" ends before "vonnegut" continues.
  function buildMultiWordSurname(tokens, start) {
    const words = []; let i = start;
    while (i < tokens.length - 1 && SURNAME_PREFIXES.has(tokens[i].toLowerCase())) {
      words.push(tokens[i].toLowerCase().replace(/[^a-z]/g, '')); i++;
    }
    if (i < tokens.length) words.push(tokens[i].toLowerCase().replace(/[^a-z]/g, ''));
    const s = words.filter(Boolean).join(' ');
    return s || null;
  }

  // Word-by-word alphabetical compare: a space files before any letter.
  function compareFiling(a, b) {
    const n = Math.min(a.length, b.length);
    for (let i = 0; i < n; i++) {
      if (a[i] === b[i]) continue;
      if (a[i] === ' ') return -1;
      if (b[i] === ' ') return 1;
      return a[i] < b[i] ? -1 : 1;
    }
    return a.length - b.length;
  }

  // Dewey number compare: integer part numerically, then decimal digits
  // positionally, shorter decimal first — standard shelf filing order
  // (635 < 635.01 < 635.04 < 635.0483 < 635.1).
  function compareDeweyNums(aStr, bStr) {
    const [ai, af = ''] = String(aStr).split('.');
    const [bi, bf = ''] = String(bStr).split('.');
    const d = parseInt(ai, 10) - parseInt(bi, 10);
    if (d !== 0) return d;
    const n = Math.min(af.length, bf.length);
    for (let i = 0; i < n; i++) {
      if (af[i] !== bf[i]) return af.charCodeAt(i) - bf.charCodeAt(i);
    }
    return af.length - bf.length;
  }

  function parseSurnameAndFirst(s) {
    if (!s) return null;
    let str = String(s).trim().replace(/\s*\d+\s*$/, '').trim();
    if (!str) return null;
    if (str.includes(',')) {
      const parts = str.split(',').map(p => p.trim()).filter(Boolean);
      const sTokens = parts[0].split(/\s+/).filter(Boolean);
      const surname = buildMultiWordSurname(sTokens, 0) || lettersLower(parts[0]);
      const first   = parts[1] ? lettersLower(parts[1]) : '';
      if (!surname) return null;
      return { surname, first };
    }
    let tokens = str.split(/\s+/).filter(Boolean);
    if (!tokens.length) return null;
    while (tokens.length > 1 && /^(jr|sr|ii|iii|iv|v|esq)\.?$/i.test(tokens[tokens.length - 1])) tokens.pop();
    if (tokens.length === 1) return { surname: lettersLower(tokens[0]), first: '' };
    const t0 = tokens[0], t1 = tokens[1];
    // Surname-first heuristic: all-caps first token followed by a token that
    // is NOT all-caps (mixed case, all-lowercase, or an initial like "s.").
    // Requiring [A-Z][a-z] here missed real stickers like "WACHMAN sam",
    // which then fell through to First-Last parsing → surname "sam".
    // "KURT VONNEGUT" (both all-caps) still takes the last-token path.
    if (/^[A-Z]{2,}$/.test(t0) && !/^[A-Z]{2,}\.?$/.test(t1)) {
      const surname = buildMultiWordSurname(tokens.slice(0, -1), 0) || lettersLower(t0);
      return { surname, first: lettersLower(tokens[tokens.length - 1]) };
    }
    let surnameStart = tokens.length - 1;
    while (surnameStart > 1 && SURNAME_PREFIXES.has(tokens[surnameStart - 1].toLowerCase())) surnameStart--;
    const surname = buildMultiWordSurname(tokens, surnameStart);
    const first   = lettersLower(tokens.slice(0, surnameStart).join(''));
    return { surname: surname || lettersLower(tokens[tokens.length - 1]), first };
  }

  function parseDewey(s) {
    if (!s) return null;
    const m = s.match(/^\s*([0-9]+(?:\.[0-9]+)?|[A-Za-z]+)\s*([A-Za-z]+)?/i);
    if (!m) return null;
    const num    = isNaN(parseFloat(m[1])) ? null : parseFloat(m[1]);
    const numStr = num === null ? null : m[1];
    const prefix = m[1].toLowerCase();
    let cut = (m[2] || '').toLowerCase();
    if (num === null) cut = (prefix + cut).replace(/[^a-z]/g, '');
    return { num, numStr, cut, prefix };
  }

  function extractVolume(book) {
    if (typeof book.series_volume === 'number' && isFinite(book.series_volume)) return book.series_volume;
    if (book.spine_label) { const m = String(book.spine_label).match(/(\d+)\s*$/); if (m) return parseInt(m[1], 10); }
    return null;
  }

  function sortKey(book, section) {
    if (book.confidence === 'low') return null;
    const vol   = extractVolume(book);
    // Titles must never tie-break unless human/OL-verified: Gemini titles are
    // frequently unverified (verifyTitlesOpenLibrary's timeout/budget-abort
    // path keeps the raw title with title_verified=false), and unverified
    // titles feeding compareKeys produced false "out of order" flags on
    // same-author runs. Both fiction and nonfiction now use the title only when
    // OL-verified; unverified titles resolve to '' and compareKeys treats an
    // empty title on either side as tied (no flag). For same-author fiction the
    // tie-break order is series/volume first (vol, extracted from the spine),
    // then verified title A-Z, so publication/series-ordered runs are not
    // flagged unless a verified title genuinely places a book out of sequence.
    // Titles stay on the label objects for display either way.
    const title = book.title_verified
      ? lettersLower((book.title || '').replace(/^the\s+|^a\s+|^an\s+/i, ''))
      : '';
    function strKey(s) {
      const a = parseSurnameAndFirst(s);
      return a ? { kind: 'str', val: a.surname, first: a.first, vol, title } : null;
    }
    if (section === 'fiction')    return book.spine_label ? strKey(book.spine_label) : null;
    if (section === 'nonfiction') { const d = parseDewey(book.spine_label); return d ? { kind: 'dewey', val: d, vol, title } : null; }
    const d = parseDewey(book.spine_label);
    if (d && d.num !== null) return { kind: 'dewey', val: d, vol, title };
    return book.spine_label ? strKey(book.spine_label) : null;
  }

  function compareKeys(a, b) {
    if (a.kind !== b.kind) return a.kind === 'dewey' ? -1 : 1;
    let cmp;
    if (a.kind === 'str') {
      cmp = compareFiling(a.val, b.val);
    } else {
      if (a.val.numStr === null || b.val.numStr === null) {
        cmp = (a.val.numStr === null) === (b.val.numStr === null) ? 0
            : (a.val.numStr === null ? 1 : -1);
      } else {
        const as = String(a.val.numStr), bs = String(b.val.numStr);
        // A bare read ("635") next to a decimal read with the same integer
        // part ("635.04") is more often a truncated read than a really-bare
        // sticker, and bare-sorts-first would then flag the correctly-read
        // neighbor. Treat the pair as fully tied (no cutter tiebreak — the
        // two books' cutters aren't comparable across that uncertainty).
        if (as.includes('.') !== bs.includes('.') &&
            parseInt(as, 10) === parseInt(bs, 10)) return 0;
        cmp = compareDeweyNums(as, bs);
      }
      if (cmp === 0) cmp = a.val.cut.localeCompare(b.val.cut, undefined, { sensitivity: 'base' });
    }
    if (cmp !== 0) return cmp;
    if (a.kind === 'str') {
      cmp = compareFiling(a.first || '', b.first || '');
      if (cmp !== 0) return cmp;
    }
    const av = a.vol == null ? Infinity : a.vol, bv = b.vol == null ? Infinity : b.vol;
    if (av !== bv) return av - bv;
    const at = a.title || '', bt = b.title || '';
    if (!at || !bt) return 0;
    return at.localeCompare(bt, undefined, { sensitivity: 'base' });
  }

  function longestNonDecreasingSubseq(keys) {
    // Guard the empty case explicitly: below, bestEnd starts at 0 assuming
    // dp[0]/prev[0] exist, but when a shelf's books all have unparseable/
    // low-confidence labels, checkOrderOneShelf calls this with keys=[]. dp
    // and prev are then empty arrays, so prev[0] is undefined rather than
    // -1, and the backtrack loop below (`i !== -1`) never terminates —
    // undefined !== -1 forever — pegging the main thread in an infinite
    // loop. This was the exact cause of the renderer hard-freezing after a
    // Gemini refine landed on a dense multi-row photo: it only takes one
    // shelf row (of any size) whose books are *all* unverifiable/low-
    // confidence to hit this.
    if (!keys.length) return new Set();
    const n = keys.length, dp = new Array(n).fill(1), prev = new Array(n).fill(-1);
    let bestEnd = 0;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < i; j++) {
        if (compareKeys(keys[j], keys[i]) <= 0 && dp[j] + 1 > dp[i]) { dp[i] = dp[j] + 1; prev[i] = j; }
      }
      if (dp[i] > dp[bestEnd]) bestEnd = i;
    }
    const set = new Set();
    for (let i = bestEnd; i !== -1; i = prev[i]) set.add(i);
    return set;
  }

  function groupByShelfRow(books) {
    const byRow = new Map();
    for (const b of books) {
      const row = (typeof b.shelfRow === 'number' && b.shelfRow >= 0) ? b.shelfRow : 0;
      if (!byRow.has(row)) byRow.set(row, []);
      byRow.get(row).push(b);
    }
    return [...byRow.entries()].sort((a, b) => a[0] - b[0]).map(([, shelf]) => shelf);
  }

  function editDistance(a, b) {
    a = a || ''; b = b || '';
    const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      prev = cur;
    }
    return prev[n];
  }

  function checkOrderOneShelf(books, section) {
    const keys = books.map(b => sortKey(b, section));

    function samePrimary(a, b) {
      if (a.kind !== b.kind) return false;
      return a.kind === 'str' ? a.val === b.val && (a.first || '') === (b.first || '')
                              : a.val.num === b.val.num && a.val.cut === b.val.cut;
    }
    function primaryStr(k) { return k.kind === 'str' ? (k.val || '') : String(k.val.num ?? ''); }

    // Pre-pass: demote obvious OCR outliers before LIS
    const misreads = [];
    for (let i = 0; i < keys.length; i++) {
      if (!keys[i]) continue;
      let L = i - 1; while (L >= 0 && !keys[L]) L--;
      let R = i + 1; while (R < keys.length && !keys[R]) R++;
      if (L < 0 || R >= keys.length) continue;
      const kL = keys[L], kR = keys[R], kM = keys[i];
      if (samePrimary(kL, kR) && !samePrimary(kM, kL)) { misreads.push(i); continue; }
      const vL = primaryStr(kL), vR = primaryStr(kR), vM = primaryStr(kM);
      if (vL && vR && vM && vL[0] === vR[0] &&
          Math.abs(vM.charCodeAt(0) - vL.charCodeAt(0)) >= 3 &&
          Math.abs(vM.charCodeAt(0) - vR.charCodeAt(0)) >= 3) misreads.push(i);
    }
    for (const i of misreads) keys[i] = null;

    const vIdx = []; keys.forEach((k, i) => { if (k) vIdx.push(i); });
    const lisLocal  = longestNonDecreasingSubseq(vIdx.map(i => keys[i]));
    const lisGlobal = new Set([...lisLocal].map(li => vIdx[li]));

    const sortedV = [...vIdx].sort((a, b) => compareKeys(keys[a], keys[b]));
    const idealRank = new Map();
    sortedV.forEach((origIdx, rank) => idealRank.set(origIdx, vIdx[rank] + 1));

    const tiedSlots = new Map();
    let r = 0;
    while (r < sortedV.length) {
      let s = r;
      while (s + 1 < sortedV.length && compareKeys(keys[sortedV[s + 1]], keys[sortedV[r]]) === 0) s++;
      const lo = vIdx[r] + 1, hi = vIdx[s] + 1;
      for (let k = r; k <= s; k++) tiedSlots.set(sortedV[k], [lo, hi]);
      r = s + 1;
    }
